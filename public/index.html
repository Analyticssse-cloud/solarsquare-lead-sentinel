<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Review</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<style>
  body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)}
  a{color:var(--color-accent)}
  a:hover{color:var(--color-accent-700)}
  .wrap{max-width:1280px;margin:0 auto;padding:0 30px}
  .ls-scroll::-webkit-scrollbar{height:8px}
  .ls-scroll::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--color-text) 18%,transparent);border-radius:999px}
  select.input{appearance:none;-webkit-appearance:none;cursor:pointer}
  button{font-family:var(--font-body)}
  @keyframes lsfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* depth + state: the page stays paper, but a row you can act on lifts under the cursor */
  .ls-row{transition:background .13s ease,box-shadow .13s ease,padding-left .13s ease}
  .ls-row:hover{background:color-mix(in srgb,var(--color-text) 3.5%,transparent)}
  .ls-row[data-on="1"]{background:var(--color-bg);box-shadow:var(--shadow-sm)}
  .ls-cat{transition:background .13s ease}
  .ls-cat:hover{background:color-mix(in srgb,var(--color-text) 4%,transparent)}
  .ls-badge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.07em;
            text-transform:uppercase;font-weight:600;padding:3px 9px;border-radius:2px;white-space:nowrap;line-height:1.5}
  .ls-bar{display:block;height:5px;width:100%;background:color-mix(in srgb,var(--color-text) 9%,transparent);
          border-radius:999px;overflow:hidden}
  .ls-bar>i{display:block;height:100%;border-radius:999px;transition:width .45s cubic-bezier(.2,.7,.3,1)}
  .ls-lift{transition:box-shadow .15s ease,transform .15s ease}
  .ls-lift:hover{box-shadow:var(--shadow-md)}
  .ls-btn{cursor:pointer;font-family:inherit;border-radius:2px;transition:background .13s ease,color .13s ease,border-color .13s ease}
  .ls-btn-solid{border:1px solid var(--color-accent);background:var(--color-accent);color:#fff}
  .ls-btn-solid:hover{background:var(--color-accent-600);border-color:var(--color-accent-600)}
  .ls-btn-ghost{border:1px solid color-mix(in srgb,var(--color-text) 22%,transparent);background:none;color:var(--color-text)}
  .ls-btn-ghost:hover{border-color:var(--color-accent);color:var(--color-accent-700)}
  button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{
    outline:2px solid var(--color-accent);outline-offset:2px}
  i[class^="ph-"],i[class*=" ph-"]{line-height:1;flex:none}
  .ls-3col{display:grid;grid-template-columns:216px 278px minmax(0,1fr);gap:40px;align-items:start;padding-top:14px}
  .ls-rail{position:sticky;top:18px}
  @media (max-width:1180px){.ls-3col{grid-template-columns:198px 244px minmax(0,1fr);gap:24px}}
  @media (max-width:960px){.ls-3col{grid-template-columns:1fr;gap:26px}.ls-rail{position:static}}
  .ls-rules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:34px;padding:6px 0 34px;max-width:1100px}
  @media (max-width:900px){.ls-rules{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .ls-trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
</style>
</head>
<body>
<div id="app" style="min-height:100vh;background:radial-gradient(130% 90% at 92% -20%, var(--color-accent-100) 0%, var(--color-bg) 55%)"></div>

<script>
// Five categories, two accents. Each badge uses ONE ramp — magenta for a leak that has
// already cost a meeting, cyan for a leak still recoverable, neutral for watch-only.
const CATC={
 mcch_past:      {tone:'var(--color-accent-2)',    tint:'var(--color-accent-2-100)',ink:'var(--color-accent-2-800)',icon:'ph-calendar-x'},
 followup_missed:{tone:'var(--color-accent-2-400)',tint:'var(--color-accent-2-100)',ink:'var(--color-accent-2-700)',icon:'ph-phone-x'},
 not_interested: {tone:'var(--color-accent-700)',  tint:'var(--color-accent-100)',  ink:'var(--color-accent-800)',  icon:'ph-hand-palm'},
 not_qualified:  {tone:'var(--color-accent)',      tint:'var(--color-accent-100)',  ink:'var(--color-accent-800)',  icon:'ph-funnel-x'},
 mcch_future:    {tone:'color-mix(in srgb,var(--color-text) 45%,transparent)',
                  tint:'color-mix(in srgb,var(--color-text) 7%,transparent)',
                  ink:'color-mix(in srgb,var(--color-text) 78%,transparent)',icon:'ph-calendar-check'},
};
const CATS=[
 {key:'mcch_past',name:'Meeting confirmed · date passed',short:'MCCH past',dot:'#1668b3',
  check:'The confirmed meeting (MCCH) date is before today, but the lead is still at MCCH — the meeting was never moved to MD and no fresh date was set. A stuck MCCH is a silent MD leak.',
  reasons:['Meeting not marked MD despite date passing','No reschedule after no-show','Stuck at MCCH >48h post-meeting','Customer met but stage not updated']},
 {key:'followup_missed',name:'Follow-up overdue',short:'Follow-up',dot:'#2f9e8f',
  check:'Follow-up date (CNC / call-later / meeting-postponed) is today or earlier, but no connect attempt is logged today. Every day cold lowers Lead→MS conversion.',
  reasons:['No connect attempt logged today','Follow-up date not honoured','No new follow-up date set','Reassigned but not actioned']},
 {key:'not_interested',name:'Marked not interested',short:'Not int.',dot:'#e0821a',
  check:'Lead was closed as Not Interested — the real objection was not captured / handled, or it was set to lost prematurely (before MD).',
  reasons:['Objection not handled','No reason / objection logged','Closed before MD (too early)','No win-back attempt']},
 {key:'not_qualified',name:'Marked not qualified',short:'Not qual.',dot:'#0d3c66',
  check:'Lead was closed as Not Qualified — a discovery call did not happen or the disqualification criteria do not genuinely apply.',
  reasons:['No discovery call logged','Qualification criteria not applied','Reason code missing','Reopen candidate']},
 {key:'mcch_future',name:'Meeting confirmed · upcoming',short:'MCCH ahead',dot:'#6aa9dd',
  check:'Meeting (MCCH) is confirmed for a future date but the slot is outside the D+2 window, the customer confirmation is missing, or prep was not done.',
  reasons:['Customer confirmation not logged','Slot beyond D+2 window','No prep note sent to customer','Held / duplicate slot']},
];
const DAILY_PER_CAT=3, DAILY_CAP=15;
const ACTIONS=['No action needed','LRM to call the customer today','LRM to set a fresh follow-up date',
 'LRM to correct the CRM record','LRM to re-attempt the meeting','Re-open the lead',
 'Reassign to another LRM','TL to coach the LRM','Escalate to ADOS'];
// Every action needs a name against it, and a verdict on whether this is a person problem
// or a system one \u2014 the two things the old form could not say.
const OWNERS=[['lrm','The LRM'],['tl','The TL'],['sc','SC']];
const FAULTS=[['coachable','Coachable \u2014 behaviour or skill'],['system','System issue \u2014 process or tooling']];
const FAULTMETA={coachable:['Coachable','background:var(--color-accent-100);color:var(--color-accent-800)'],
 system:['System','background:var(--color-accent-2-100);color:var(--color-accent-2-800)']};
const SEVS=[['low','Low'],['med','Medium'],['high','High']];
const SEVMETA={low:['Low sev','background:var(--color-accent-2-100);color:var(--color-accent-2-800)'],med:['Med sev','background:var(--color-accent-100);color:var(--color-accent-800)'],high:['High sev','background:var(--color-accent-200);color:var(--color-accent-800)']};
const RULES=[
 ['1','Pool','Every lead where a breach condition fired in the last 30 days, up to today.'],
 ['2','Eligibility','Category rule applied, minus anything RCA-ed in the last 7 days — a cooldown so leads keep rotating.'],
 ['3','Priority','Breach age weighted 10×, days of silence as the tiebreaker (capped at 60).'],
 ['4','Daily pick','Top 3 per category — 15 a day per TL, LRM-balanced and seeded to the date so the pull is reproducible.'],
];
const MTD=null; // month-to-date adherence needs a shared RCA history store; never fake it
// ---- RCA: three fixed steps, every category ----
// What happened -> Why -> Root cause. Always exactly three clicks, so two audits are
// always comparable. The vocabulary is category-specific on purpose: a follow-up leak and
// a disqualification do not share language, and forcing one taxonomy on both is what made
// the old branching tree unreportable.
const RCA3={
 mcch_past:{q:['What happened with this meeting?','Why did that happen?','Which root cause fits best?'],w:[
  {t:'The meeting never took place',y:[
    {t:'Customer did not turn up or was unavailable',r:['No reconfirmation call before the slot','Customer rescheduled the meeting','Wrong / incomplete address, location missing']},
    {t:'SC did not reach the customer or the site',r:['SC no-show','SC got late in previous meeting','SC distance issue']},
    {t:'The slot was never a real appointment',r:['MCCH marked without customer agreement','Slot entered to hold the stage']}]},
  {t:'The meeting happened but the stage never moved',y:[
    {t:'SC did not mark MD after the meeting',r:['Meeting done, stage not updated \u2014 process discipline']}]},
  {t:'Nothing was attempted after the date lapsed',y:[
    {t:'LRM missed it',r:['Hygiene issue']}]}]},
 followup_missed:{q:['What happened on the due date?','Why did that happen?','Which root cause fits best?'],w:[
  {t:'No attempt was made at all',y:[
    {t:'Missed by LRM',r:['LRM absent / week-off','Hygiene issue']}]},
  {t:'It was worked but never logged',y:[
    {t:'LRM did not update Lighthouse',r:['Contact attempted but not logged \u2014 process gap']}]}]},
 not_interested:{q:['What happened at the close?','Why did that happen?','Which root cause fits best?'],w:[
  {t:'Is \u201cNot interested\u201d true? \u2014 Yes',y:[
    {t:'Comment updated on Lighthouse',r:[]}]},
  {t:'Is the lead interested? \u2014 Yes',y:[
    {t:'LRM did not handle the objection',r:[]},
    {t:'LRM did not do micro-selling',r:[]}]},
  {t:'Is the stage updated correctly?',y:[
    {t:'Yes',r:[]},
    {t:'No',r:[]}]}]},
 not_qualified:{q:['What happened at the disqualification?','Why did that happen?','Which root cause fits best?'],w:[
  {t:'Disqualified with no qualification call',y:[
    {t:'LRM decided on assumption',r:['Disqualified on assumption \u2014 no proper qualification']},
    {t:'Customer could not be reached to qualify',r:['Customer not reachable \u2014 no retry cadence','Bad contact data \u2014 could not qualify']}]},
  {t:'Lead does not qualify',y:[
    {t:'The disqualifier is real and documented',r:['Valid disqualification \u2014 correctly marked']}]},
  {t:'It qualifies but was closed anyway',y:[
    {t:'Incorrect stage update',r:['Marked incorrectly on Lighthouse']}]}]},
 mcch_future:{q:['What is wrong with this upcoming meeting?','Why is it that way?','Which root cause fits best?'],w:[
  {t:'Customer confirmation is not on record',y:[
    {t:'LRM set the date without the customer agreeing',r:['MCCH set without customer confirmation']},
    {t:'Confirmed verbally, never logged',r:['Customer confirmed but not logged \u2014 data gap']}]},
  {t:'The slot sits outside the D+2 window',y:[
    {t:'Customer is only available later',r:['Slot beyond D+2 \u2014 customer availability']}]},
  {t:'The slot looks held or duplicated',y:[
    {t:'LRM booked it to show MCCH',r:['Fake MCCH']}]}]},
};
const DEFAULT_AUDITORS=['quality.desk@solarsquare.in'];
const ADMIN_FALLBACK=['analytics.sse@solarsquare.in'];
const adminEmails=()=>AUTH.admins&&AUTH.admins.length?AUTH.admins:ADMIN_FALLBACK;
const nameFromEmail=e=>{const s=String(e||'').split('@')[0];return s.split(/[._]+/).filter(Boolean).map(w=>w[0].toUpperCase()+w.slice(1)).join(' ')||e;};
const ROLECLS={ADOS:'tag tag-accent-2',ZSM:'tag tag-accent',TL:'tag tag-outline',LRM:'tag tag-neutral'};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function fmtLongDate(s){if(!s)return'';const d=new Date(String(s).slice(0,10)+'T00:00:00');return isNaN(d)?'':DOW[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear();}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=e=>String(e||'').trim().toLowerCase().replace('@homes.solarsquare.in','@solarsquare.in');
const ini2=n=>{const p=String(n||'').trim().split(/\s+/);return((p[0]&&p[0][0]||'')+(p[1]&&p[1][0]||'')).toUpperCase();};
const first1=n=>String(n||'').split(' ')[0];
const fmtD=iso=>{if(!iso)return'';const d=new Date(iso);return isNaN(d)?'':d.getDate()+' '+MON[d.getMonth()];};
const fmtDT=iso=>{if(!iso)return'\u2014';const d=new Date(iso);if(isNaN(d))return'\u2014';let h=d.getHours(),m=String(d.getMinutes()).padStart(2,'0'),ap=h<12?'AM':'PM';h=h%12||12;return d.getDate()+' '+MON[d.getMonth()]+', '+h+':'+m+' '+ap;};
const ACTLBL={call:'Call logged',stage_change:'Stage changed',meeting_done:'Meeting marked done',followup_set:'Follow-up set',crm_touch:'CRM record edited',none:'No activity ever recorded'};
const LEAKLBL={L1:'Meeting date passed, nothing since',L2:'Marked CNC, never re-dialled',L3:'Call-later loop turning, no close',L4:'Closed with no connected call',L4b:'Closed \u2014 check the reason',L5:'DEV started, no meeting ever done',L0:'Watch only'};const silentLbl=l=>{if(l.lastAt==null)return'never touched';const h=l.hoursSilent||0;if(h<24)return h<=1?'active this hour':h+'h silent';return (l.silent||Math.round(h/24))+'d silent';};
const catObj=k=>CATS.find(c=>c.key===k);

const S={screen:'queue',mtdLvl:'tl',rcaRange:'today',rcaFilter:'pending',rcaTouched:{},actFilter:'open',actBusy:'',recs:{},recBusy:null,rcaLog:[],rcaPending:0,rcaErr:'',diag:null,diagState:'',access:null,accessBusy:'',accessErr:'',accessFilter:'all',newAccessEmail:'',newAccessRole:'auditor',
  setTab:'access',mapping:null,unmapped:[],mapBusy:'',mapErr:'',mapMsg:'',mapQ:'',mapFilter:'overridden',mapSel:{},mapBulkTl:'',auditRaw:'',auditDate:'',tlEmail:null,catKey:'mcch_past',selId:null,audits:{},rcaReview:{},showRules:false,model:null,src:'live',role:'tl',user:null,meEmail:null,hier:[],rcaAuditors:null,newAuditor:'',dirQ:''};

const AUTH={enabled:true,ready:false,clientId:'',domain:'solarsquare.in',domains:['solarsquare.in','homes.solarsquare.in'],admins:[]};
const onAuthDomain=em=>{const e=String(em||'').toLowerCase();return !AUTH.domains.length||AUTH.domains.some(d=>e.endsWith('@'+d));};
const authDomainList=()=>AUTH.domains.map(d=>'@'+d).join(' or ');
const LOGO_SRC='./solarsquare-logo.png';   // 1259×828, transparent — sharp up to ~900px wide
function logoImg(h){return '<img src="'+LOGO_SRC+'" alt="SolarSquare" style="height:'+h+'px;width:auto;display:block" onerror="logoFallback(this,'+h+')">';}
function logoFallback(el,h){const fs=Math.round(h*0.66);el.outerHTML='<span style="font-family:var(--font-heading);font-size:'+fs+'px;font-weight:600;letter-spacing:-.01em;color:var(--color-text)">Solar<span style="color:var(--color-accent)">Square</span></span>';}
// A full-bleed brand moment while the queue loads. The logo is 1264px wide with a real
// alpha channel, so it can own the screen without going soft. It is bounded by BOTH axes:
// sized from width on tall windows, capped by height on short ones, so the caption below
// it — the only thing saying the app is still working — never falls off the fold.
function splash(msg){
  return '<div style="position:fixed;inset:0;display:grid;place-items:center;padding:5vmin;background:var(--color-bg);overflow:hidden">'+
    '<div style="display:flex;flex-direction:column;align-items:center;gap:min(4vmin,34px);width:100%;max-width:1000px">'+
      '<img src="'+LOGO_SRC+'" alt="SolarSquare" style="width:min(70vw,860px);max-height:44vh;height:auto;object-fit:contain;display:block" onerror="logoFallback(this,120)">'+
      '<div style="display:flex;flex-direction:column;align-items:center;gap:min(1.6vmin,12px)">'+
        '<div style="font-family:var(--font-heading);font-size:clamp(22px,3.4vmin,42px);line-height:1;font-weight:700;letter-spacing:-.025em;text-align:center">Lead Review</div>'+
        '<div style="font-size:clamp(10px,1.5vmin,13.5px);letter-spacing:.16em;text-transform:uppercase;color:'+MUT(42)+';text-align:center">'+esc(msg)+'</div>'+
      '</div>'+
    '</div></div>';
}
const ROLE_LABEL={tl:'Team Lead',zsm:'Zonal Manager',ados:'ADOS',admin:'Admin',auditor:'RCA auditor',blocked:'No access',none:'No team mapped'};
function readSession(){try{return JSON.parse(localStorage.getItem('ls_auth')||'null');}catch(e){return null;}}
function saveSession(o){try{localStorage.setItem('ls_auth',JSON.stringify(o));}catch(e){}}
function signOut(){try{if(window.google&&google.accounts&&google.accounts.id)google.accounts.id.disableAutoSelect();}catch(e){}localStorage.removeItem('ls_auth');location.reload();}
function decodeJwt(t){try{const b=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(b))));}catch(e){return{};}}
function authHeaders(){const a=readSession();return a&&a.token?{Authorization:'Bearer '+a.token}:{};}
let gisReady=null;
function loadGis(){if(gisReady)return gisReady;gisReady=new Promise(res=>{if(window.google&&google.accounts)return res(true);const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=1;s.defer=1;s.onload=()=>res(true);s.onerror=()=>res(false);document.head.appendChild(s);});return gisReady;}
function authMsg(html){const el=document.getElementById('autherr');if(el)el.innerHTML=html||'';}
function handleCredential(resp){const c=decodeJwt(resp.credential);const em=(c.email||'').toLowerCase();const hd=String(c.hd||'').toLowerCase();if(!(onAuthDomain(em)||AUTH.domains.indexOf(hd)>=0)){authMsg('Signed in as <b>'+esc(em||'?')+'</b> — that isn\u2019t a '+esc(authDomainList())+' account. Sign in with your SolarSquare login.');return;}saveSession({name:c.name||'',email:c.email||'',picture:c.picture||'',token:resp.credential});location.reload();}
async function renderGoogleBtn(el){
  const ok=await loadGis();
  if(!ok){authMsg('Could not reach Google Sign-In (network/adblock). Check your connection and reload.');return;}
  if(!el||!window.google)return;
  if(!AUTH.clientId){authMsg('Sign-in isn\u2019t configured yet — <code>GOOGLE_CLIENT_ID</code> is not set on the server.');return;}
  try{
    google.accounts.id.initialize({client_id:AUTH.clientId,callback:handleCredential,...(AUTH.domains.length===1?{hd:AUTH.domains[0]}:{}),
      error_callback:e=>{authMsg('Google rejected sign-in: <b>'+esc((e&&(e.type||e.message))||'unknown')+'</b>. If this says <i>origin</i>, this site\u2019s URL must be added to the OAuth client\u2019s <b>Authorized JavaScript origins</b> in Google Cloud Console.');}});
    el.innerHTML='';
    google.accounts.id.renderButton(el,{theme:'outline',size:'large',shape:'rectangular',text:'signin_with',logo_alignment:'center',width:360});
    google.accounts.id.prompt(n=>{if(n&&n.isSkippedMoment&&n.isSkippedMoment()){/* one-tap skipped; button still works */}});
  }catch(err){authMsg('Sign-in init failed: <b>'+esc(String(err&&err.message||err))+'</b>');}
}
async function initAuth(){
  try{const r=await fetch('/api/config',{cache:'no-store'});if(r.ok){const c=await r.json();AUTH.enabled=!!c.enabled;AUTH.clientId=c.clientId||'';AUTH.domains=(c.allowedDomains&&c.allowedDomains.length?c.allowedDomains:(c.allowedDomain?[c.allowedDomain]:AUTH.domains)).map(d=>String(d).toLowerCase().replace(/^@/,''));AUTH.domain=AUTH.domains[0]||'';AUTH.admins=c.admins||[];}else{AUTH.enabled=false;}}
  catch(e){AUTH.enabled=false;}
  AUTH.ready=true;
}
function loginView(denied,reason){
  const em=denied&&readSession()?esc(readSession().email):'';
  const rmap={'not-signed-in':'Your session expired. Sign in again.','invalid-token':'Your sign-in expired (tokens last ~1 hour). Sign in again.','wrong-audience':'Server GOOGLE_CLIENT_ID doesn\u2019t match the one issuing your login — the two client IDs must be identical.','wrong-domain':'That account isn\u2019t on an allowed Workspace domain (\u0040solarsquare.in or \u0040homes.solarsquare.in).','not-authorized':'Your email isn\u2019t on the ALLOWED_EMAILS allowlist. Ask an admin to add you.','email-unverified':'Your Google email isn\u2019t verified.'};
  const rmsg=reason?(rmap[reason]||('Server said: '+esc(reason))):'';
  document.getElementById('app').innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:40px 24px">
    <div style="width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;text-align:center">
      <div style="margin-bottom:36px">${logoImg(52)}</div>
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:14px">
        <span style="width:52px;height:52px;flex:none;border-radius:999px;background:var(--color-accent);display:grid;place-items:center"><span style="width:21px;height:21px;border-radius:999px;border:5px solid var(--color-bg)"></span></span>
        <span style="font-family:var(--font-heading);font-size:44px;line-height:1;letter-spacing:-.015em">Lead Review</span>
      </div>
      <div style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:${MUT(42)};margin-bottom:28px">Conversion Desk</div>
      <div style="width:56px;height:1px;background:${MUT(18)};margin-bottom:28px"></div>
      <div style="font-size:15px;line-height:1.6;color:${MUT(62)};max-width:36ch;margin-bottom:32px">${denied?`<b>${em}</b> isn’t authorised for Lead Review.<br>Sign in with a mapped TL or manager account, or ask an admin for access.`:'Sign in with your SolarSquare account to open today’s audit queue.'}</div>
      <div id="gbtn" style="min-height:48px;display:grid;place-items:center;width:100%"></div>
      <div id="autherr" style="font-size:12.5px;line-height:1.55;color:var(--color-accent-2-700);max-width:360px;margin-top:16px">${rmsg}</div>
      ${denied?`<button class="btn btn-secondary" onclick="signOut()" style="font-size:12.5px;margin-top:16px">Use a different account</button>`:''}
      <div style="font-size:12px;color:${MUT(42)};margin-top:36px">Restricted to ${esc(authDomainList())} accounts</div>
    </div></div>`;
  renderGoogleBtn(document.getElementById('gbtn'));
}

function errorView(why){
  const w=why||{};
  const diag={
    no_server:['No API on this host','<code>/api/queue</code> returned 404. Serverless routes only run on the deployed Vercel app — this is expected in a local preview.'],

function fetchT(url,ms,headers){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||3500);return fetch(url,{signal:c.signal,headers:headers||{}}).finally(()=>clearTimeout(t));}
async function load(){
  if(SAMPLE){applySample(SAMPLE_ROLE);return;}
  await initAuth();
  const sess=readSession();
  if(AUTH.enabled&&!sess){return loginView(false);}
  document.getElementById('app').innerHTML=splash('Loading Lead Review…');
  let data=null,fail={kind:'net'};
  // One retry: the first call after a deploy pays the cold start and can outrun the budget,
  // while the second lands on a warm function with the response already cached.
  for(let attempt=0;attempt<2&&!data;attempt++){
    if(attempt)document.getElementById('app').innerHTML=splash('Still loading — the first request after a deploy is slow…');
    try{const r=await fetchT('/api/queue',attempt?90000:45000,authHeaders());
      if(r.status===401||r.status===403){let reason='';try{reason=(await r.json()).error||'';}catch(e){}return loginView(true,reason);}
      if(r.status===404){fail={kind:'no_server'};break;}
      else if(!r.ok){let d='';try{d=(await r.json()).error||'';}catch(e){}fail={kind:'http',status:r.status,detail:d};}
      else{const j=await r.json();
        // An empty queue is a normal day, not a failure — load the app and show an empty state.
        // Only a missing or erroring API blocks entry.
        if(j&&Array.isArray(j.queue)){data=j;S.src='live';}
        else fail={kind:'empty'};
        break;
      }
    }catch(e){
      const ab=e&&(e.name==='AbortError'||/abort/i.test(String(e.message||'')));
      fail=ab?{kind:'slow'}:{kind:'net',detail:String(e&&e.message||e)};
    }
  }
  if(!data){return errorView(fail);}
  S.role=data.role||'tl';
  S.auditRaw=String((data.queue&&data.queue[0]&&data.queue[0].audit_date)||'').slice(0,10);
  S.auditDate=fmtLongDate((data.queue&&data.queue[0]&&data.queue[0].audit_date)||'');
  S.user=data.user||sess||null;
  S.meEmail=norm(data.meEmail||'')||null;
  S.unmapped=data.unmappedLrms||[];
  S.mapping=data.mappingOverrides||null;
  buildModel(data.queue||[],data.hierarchy||[]);
  if(S.role==='zsm'||S.role==='ados'||S.role==='admin')S.screen='mgr';
  render();
  loadRcaLog();
  loadAccess();
  if(S.role==='admin')loadMapping();
  flushRca();
  if(!(data.queue||[]).length)loadDiag();
}

function buildModel(queue,hier){
  const H={};hier.forEach(h=>H[norm(h.lrm_email)]=h);
  const base={mcch_past:45,followup_missed:40,not_interested:52,not_qualified:52,mcch_future:34};
  const leadsByTl={},tlMeta={},tlByName={};
  queue.forEach(row=>{
    const h=H[norm(row.lrm_email)]||{};
    // One team lead, one row. The mapping sheet carries the same person under more than
    // one address (@homes vs @solarsquare, stray casing) and occasionally a second
    // spelling of the name — which is why Team progress listed the same TL twice. Key on
    // the normalised email, then collapse on the name.
    let tl=norm(h.tl_email)||'unassigned';
    const nk=String(h.tl_name||'').trim().toLowerCase();
    if(nk){if(tlByName[nk])tl=tlByName[nk];else tlByName[nk]=tl;}
    const urg=Math.max(20,Math.min(100,base[row.category]+(row.days_overdue||0)*8));
    const cname=row.customer_name||('Lead '+row.lead_id);
    const lead={id:row.lead_id,cat:row.category,name:cname,loc:row.cluster,
      meta:(row.cluster||'')+' · '+row.lead_id,LRM:row.lrm_name,ini:ini2(row.customer_name||row.lrm_name||'NA'),lrmIni:ini2(row.lrm_name),
      urg:urg,days:row.days_overdue||0,tlEmail:tl,tlName:h.tl_name||'Unassigned',
      key:Number(row.priority_key)||0,rank:row.category_rank||99,slot:'primary',
      lrmEmail:row.lrm_email||'',
      stage:row.lead_stage||'',status:row.lead_status||'',
      stageMismatch:row.stage_mismatch===true||row.stage_mismatch==='TRUE'||row.stage_mismatch==='true',
      crmStage:row.lead_table_stage||'',
      timeline:buildTL(row),systemNote:buildNote(row),
      lastAt:row.last_activity_at||null,lastType:row.last_activity_type||'',
      silent:Number(row.days_silent)||0,hoursSilent:Number(row.hours_silent)||0,
      calls30:Number(row.calls_30d)||0,connects30:Number(row.connects_30d)||0,leak:row.leak_code||'',
      loops:Number(row.loop_turns)||0,
      sit:row.category==='not_interested'?(row.meeting_confirmed_at?'met':'early'):row.category==='not_qualified'?(row.qualified_at?'disc':'nodisc'):row.category==='followup_missed'?((row.days_overdue||0)>0?'overdue':'today'):''};
    (leadsByTl[tl]=leadsByTl[tl]||[]).push(lead);
    tlMeta[tl]=tlMeta[tl]||{name:h.tl_name||'Unassigned',ini:ini2(h.tl_name||'NA'),cluster:h.cluster||row.cluster};
  });
  // Daily pick, per TL: 3 per category pooled across ALL of that TL's LRMs, then top up to
  // 15 from the leftovers (most overdue first) if any category came up short.
  Object.keys(leadsByTl).forEach(tl=>{
    const byCat={};leadsByTl[tl].forEach(l=>(byCat[l.cat]=byCat[l.cat]||[]).push(l));
    const rank=(a,b)=>(b.key-a.key)||(b.urg-a.urg)||(b.days-a.days);
    let keep=[],rest=[];
    CATS.forEach(c=>{const pool=(byCat[c.key]||[]).slice().sort(rank);keep=keep.concat(pool.slice(0,DAILY_PER_CAT));rest=rest.concat(pool.slice(DAILY_PER_CAT));});
    if(keep.length<DAILY_CAP)rest.sort((a,b)=>(b.days-a.days)||rank(a,b)).slice(0,DAILY_CAP-keep.length).forEach(l=>keep.push({...l,slot:'backfill'}));
    leadsByTl[tl]=keep;
  });
  const lrmsByTl={},lrmRiskByTl={};
  Object.keys(leadsByTl).forEach(tl=>{
    const ls=leadsByTl[tl],byLrm={};
    ls.forEach(l=>{(byLrm[l.LRM]=byLrm[l.LRM]||{name:l.LRM,ini:l.lrmIni,cats:{}}).cats[l.cat]=(byLrm[l.LRM].cats[l.cat]||0)+1;});
    const LRMs=Object.values(byLrm).map(r=>{const trend=CATS.map(c=>r.cats[c.key]||0);return{name:r.name,ini:r.ini,trend,flagged:trend.reduce((a,b)=>a+b,0)};});
    const mx=Math.max(1,...LRMs.map(r=>r.flagged));const rr={};LRMs.forEach(r=>rr[r.name]=Math.min(100,Math.round(r.flagged/mx*100)));
    lrmsByTl[tl]=LRMs;lrmRiskByTl[tl]=rr;
  });
  const busiest=Object.keys(leadsByTl).sort((a,b)=>leadsByTl[b].length-leadsByTl[a].length)[0];
  const meTl=(S.meEmail&&leadsByTl[S.meEmail])?S.meEmail:null;
  const curTl=meTl||busiest||null;
  const tls=Object.keys(leadsByTl).map((tl,i)=>{const ls=leadsByTl[tl],m=tlMeta[tl],od=ls.filter(l=>l.days>2).length;
    return{email:tl,name:m.name,ini:m.ini,cluster:m.cluster,total:ls.length,me:tl===meTl,
      topGap:topCat(ls)};});
  S.model={leadsByTl,lrmsByTl,lrmRiskByTl,tls,curTl};S.tlEmail=curTl;S.hier=hier||[];
  const mine=(curTl&&leadsByTl[curTl])||[];
  const first=(mine.filter(l=>l.cat==='mcch_past').sort((a,b)=>(b.key-a.key)||(b.silent-a.silent))[0]||mine[0]||{});
  S.selId=first.id||null;
}
function topCat(ls){const c={};ls.forEach(l=>c[l.cat]=(c[l.cat]||0)+1);const t=Object.keys(c).sort((a,b)=>c[b]-c[a])[0];return t?catObj(t).name:'—';}
function buildTL(row){const t=[],p=(iso,w,k)=>t.push({when:fmtD(iso),what:w,kind:k});
  p(row.created_at,'Lead created','done');
  if(row.category==='mcch_past'){if(row.meeting_confirmed_at)p(row.meeting_confirmed_at,'MCCH set','done');p(row.meeting_schedule_date,'Meeting due','flag');t.push({when:'today',what:'Still MCCH',kind:'pending'});}
  else if(row.category==='mcch_future'){if(row.meeting_confirmed_at)p(row.meeting_confirmed_at,'MCCH set','done');p(row.meeting_schedule_date,'Meeting due','flag');}
  else if(row.category==='followup_missed'){p(row.follow_up_at,'Follow-up due','flag');t.push({when:'today',what:'No attempt',kind:'pending'});}
  else if(row.category==='not_interested'){if(row.meeting_confirmed_at)p(row.meeting_confirmed_at,'MCCH set','done');p(row.status_changed_at,'Marked NI','flag');}
  else if(row.category==='not_qualified'){if(row.qualified_at)p(row.qualified_at,'Discovery','done');p(row.status_changed_at,'Marked NQ','flag');}
  return t;}
function buildNote(row){const d=row.days_overdue||0;const s=Number(row.days_silent)||0;
  const quiet=row.last_activity_at?(s>0?' Nothing logged on the lead for '+s+' day'+(s===1?'':'s')+'.':' Last touched today.'):' No activity ever logged.';
  if(row.category==='mcch_past')return'MCCH date '+fmtD(row.meeting_schedule_date)+' passed '+d+'d ago — still at MCCH, not moved to MD.'+quiet;
  if(row.category==='mcch_future')return'Meeting confirmed for '+fmtD(row.meeting_schedule_date)+' — verify customer confirmation logged and slot within window.'+quiet;
  if(row.category==='followup_missed')return'Follow-up '+(d?('overdue '+d+'d — due '+fmtD(row.follow_up_at)):'due today ('+fmtD(row.follow_up_at)+')')+' — '+(Number(row.calls_30d)||0)+' dial'+((Number(row.calls_30d)||0)===1?'':'s')+' in 30d.'+quiet;
  if(row.category==='not_interested')return'Marked Not Interested on '+fmtD(row.status_changed_at)+(row.meeting_confirmed_at?' — confirm the objection was captured.':' — closed before any meeting.')+quiet;
  if(row.category==='not_qualified')return'Marked Not Qualified on '+fmtD(row.status_changed_at)+(row.qualified_at?' after a discovery call.':' — no discovery call logged.')+quiet;
  return'';}

const L=()=>S.model?(S.model.leadsByTl[S.tlEmail]||[]):[];
const R=()=>S.model?(S.model.lrmsByTl[S.tlEmail]||[]):[];
const TLS=()=>S.model?S.model.tls:[];
// Ordering inside a category comes from the query's own rank_key (real signal: how long the
// breach has stood plus how long the lead has been silent). No synthetic score, no tiers.
function catLeads(k){return L().filter(l=>l.cat===k).slice()
  .sort((a,b)=>(b.key-a.key)||(b.silent-a.silent)||(b.days-a.days)||String(a.name).localeCompare(String(b.name)));}
// The log row for a lead on a given audit day — the one place review state lives.
function logRow(leadId,date){const t=date||S.auditRaw||'';
  return (S.rcaLog||[]).find(x=>String(x.lead_id)===String(leadId)&&String(x.audit_date||'').slice(0,10)===t)||null;}
// An RCA the Quality auditor sent back is not done. Resubmitting appends a fresh row with
// no verdict on it, so the lead closes again the moment the TL redoes the work.
const reworkOf=id=>{const r=logRow(id);return r&&String(r.review_verdict||'')==='rework'?r:null;};
const rcaDone=id=>{if(reworkOf(id))return false;const a=S.audits[id];if(a&&a.submitted)return true;return !!logRow(id);};
const audited=()=>L().filter(l=>rcaDone(l.id)).length;

// ---- RCA log: the shared write store ----
// Completed RCAs are appended to the RCA_Log tab via /api/rca, so every manager sees the
// same numbers. Submissions go through an outbox in localStorage: an auditor on a flaky
// connection never silently loses a logged RCA.
function outbox(){try{const v=JSON.parse(localStorage.getItem('ls_rca_outbox')||'[]');return Array.isArray(v)?v:[];}catch(e){return[];}}
function setOutbox(a){try{localStorage.setItem('ls_rca_outbox',JSON.stringify(a.slice(-200)));}catch(e){}}
function rcaKey(r){return String(r.audit_date||'')+'|'+String(r.lead_id||'');}

function rcaPayload(leadId){
  const l=L().find(x=>x.id===leadId);if(!l)return null;
  const a=S.audits[leadId]||{};if(!a.reason)return null;
  const w=r3Walk(l),path=[w.s1&&w.s1.t,w.s2&&w.s2.t,w.root].filter(Boolean).join(' → ');
  const h=(S.hier||[]).find(x=>norm(x.lrm_email)===norm(l.lrmEmail||''))||{};
  const rec=S.recs[leadId]||null;
  return{audit_date:S.auditRaw||'',lead_id:leadId,customer_name:l.name||'',category:l.cat,
    lrm_email:l.lrmEmail||'',lrm_name:l.LRM||'',
    tl_email:l.tlEmail||h.tl_email||'',tl_name:l.tlName||h.tl_name||'',
    auditor_email:(S.user&&S.user.email)||'',auditor_name:(S.user&&S.user.name)||'',
    reason:a.reason,severity:a.sev||'',action:a.action||'',note:a.note||'',why_path:path,assignee:'',
    what:(w.s1&&w.s1.t)||'',why:(w.s2&&w.s2.t)||'',owner:a.owner||'',fault:a.fault||'',
    // Carry the recording into the log. Only a REMOTE url is worth logging — a blob:
    // URL is a handle to this browser's memory and is meaningless to anyone else.
    recording_url:(rec&&rec.remote&&rec.url)||'',
    recording_name:(rec&&rec.remote&&rec.name)||'',
    action_status:a.action==='No action needed'?'n/a':(a.action_status||'open')};
}
function queueRca(leadId){
  if(SAMPLE)return;
  const p=rcaPayload(leadId);if(!p)return;
  const box=outbox().filter(x=>rcaKey(x)!==rcaKey(p));box.push(p);setOutbox(box);
  S.rcaLog=(S.rcaLog||[]).filter(x=>rcaKey(x)!==rcaKey(p)).concat([p]);
  flushRca();
}
let FLUSHING=false;
async function flushRca(){
  if(SAMPLE||FLUSHING)return;const box=outbox();if(!box.length){S.rcaPending=0;return;}
  FLUSHING=true;S.rcaPending=box.length;
  try{
    const r=await fetch('/api/rca',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify({items:box})});
    if(r.ok){setOutbox([]);S.rcaPending=0;S.rcaErr='';}
    else{const j=await r.json().catch(()=>({}));S.rcaErr=j.message||j.error||('HTTP '+r.status);}
  }catch(e){S.rcaErr='offline';}
  FLUSHING=false;
  if(S.screen)render();
}

      // A rework verdict reopens the draft, so the TL can edit rather than stare at a
      // submitted card they are being told to redo.

      // Verdicts are shared state: an auditor reloading, or a second auditor opening the

          by:x.reviewer_name||nameFromEmail(x.reviewer_email||''),at:x.reviewed_at||'',saved:true},S.rcaReview[k]);}

// ---- month-to-date scoreboard ----
// Built entirely off the shared RCA log and the reporting lines. Nothing here is
// estimated: "expected" is the daily cap times the number of days the queue actually ran
// this month, so a month with three issued days is not scored against a full month.
// Closing an action re-posts the whole RCA row with action_status=done. The log keeps the
// LATEST row per (audit_date, lead_id), so an append is an update — no edit path needed.
async function setActionStatus(auditDate,leadId,status){
  const src=(S.rcaLog||[]).find(function(x){
    return String(x.audit_date||'').slice(0,10)===auditDate&&String(x.lead_id)===String(leadId);});
  if(!src)return;
  const next=Object.assign({},src,{action_status:status});
  S.rcaLog=(S.rcaLog||[]).map(function(x){return x===src?next:x;});
  S.actBusy=auditDate+'|'+leadId;render();
  try{
    await fetch('/api/rca',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),
      body:JSON.stringify({items:[next]})});
  }catch(e){S.rcaErr='offline';}
  S.actBusy='';render();
}
// The auditor's verdict goes the same way: re-post the whole row with the review fields on
// it. This is what makes "Needs rework" mean something — the TL's queue reopens the lead
// and the scorecard can finally say whether an RCA was any good.
async function saveReview(subId){
  const p=String(subId).split('|'),date=p[0],leadId=p[1];
  const src=(S.rcaLog||[]).find(function(x){
    return String(x.audit_date||'').slice(0,10)===date&&String(x.lead_id)===String(leadId);});
  if(!src)return;
  const r=S.rcaReview[subId]||{};
  const next=Object.assign({},src,{review_verdict:r.verdict||'',review_note:r.note||'',
    reassigned_to:r.assignee||'',reviewer_email:(S.user&&S.user.email)||'',
    reviewer_name:(S.user&&S.user.name)||'',reviewed_at:new Date().toISOString()});
  S.rcaLog=(S.rcaLog||[]).map(function(x){return x===src?next:x;});
  if(SAMPLE){patchRv(subId,{saved:true});render();return;}
  S.revBusy=subId;render();
  try{
    const res=await fetch('/api/rca',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),
      body:JSON.stringify({items:[next]})});
    if(!res.ok){const j=await res.json().catch(function(){return{};});S.rcaErr=j.message||j.error||('HTTP '+res.status);}
    else{S.rcaErr='';patchRv(subId,{saved:true});}
  }catch(e){S.rcaErr='offline';}
  S.revBusy='';render();
}

// A ZSM sees their own zone, an ADOS their own region, admin sees everything.
function mtdScope(){

  if(S.role==='admin'||S.role==='auditor')return null;

// Always tally PER TEAM LEAD and clamp there, then roll the clamped numbers up. Clamping
// after aggregation lets one TL’s overflow hide inside an ADOS total, so the same data
// reads differently at each level — the roll-up must be the sum of what each TL actually
// cleared, never a re-clamp of a raw sum.
function mtdBoard(level){
  const mon=mtdMonth(),L=tlLines(),sc=mtdScope();
  const inScope=function(te){
    if(!sc)return true;const l=L.line[te];if(!l)return false;
    if(sc.role==='zsm')return l.zsm_email===sc.me;
    if(sc.role==='ados')return l.ados_email===sc.me;
    return true;};
  const monthRows=(S.rcaLog||[]).filter(function(x){return String(x.audit_date||'').slice(0,7)===mon;});
  const issuedDays=new Set(monthRows.map(function(x){return String(x.audit_date||'').slice(0,10);})).size||1;
  const capPerTl=DAILY_CAP*issuedDays;

  // ---- 1. per-TL tally ----
  const tl={};
  const tlEnt=function(te){
    if(!tl[te]){const l=L.line[te]||{};
      tl[te]={key:te,name:l.tl||nameFromEmail(te)||'Unassigned',cluster:l.cluster||'',
        ados_email:l.ados_email||'unmapped',ados:l.ados||'Unmapped',
        zsm_email:l.zsm_email||'unmapped',zsm:l.zsm||'Unmapped',
        raw:0,actions:0,closed:0,reviewed:0,acc:0,rew:0,deep:0,pairs:{}};}
    return tl[te];};
  // seed every TL that exists, not only those who logged something — a team that did
  // nothing all month is the row a manager most needs to see.
  Object.keys(L.line).forEach(function(te){if(inScope(te))tlEnt(te);});
  monthRows.forEach(function(x){
    const te=norm(x.tl_email||'')||'unmapped';
    if(!inScope(te))return;
    const e=tlEnt(te);
    if(x.tl_name&&(!L.line[te]||!L.line[te].tl))e.name=x.tl_name;
    e.raw++;
    const act=String(x.action||'');
    if(act&&act!=='No action needed'){e.actions++;if(String(x.action_status||'')==='done')e.closed++;}
    // Quality, measured from what people actually did: the auditor's verdict, and whether
    // the five-whys was walked to a real root cause or stopped at the first answer.
    const vd=String(x.review_verdict||'');
    if(vd==='accept'||vd==='rework'){e.reviewed++;if(vd==='accept')e.acc++;else e.rew++;}
    if(String(x.why_path||'').split('\u2192').filter(function(s){return s.trim();}).length>=3)e.deep++;
    const p=norm(x.lrm_email||'')+'|'+String(x.reason||'');e.pairs[p]=(e.pairs[p]||0)+1;
  });
  // clamp here, once: a TL cannot clear more than the queue issued them
  Object.keys(tl).forEach(function(te){const e=tl[te];
    e.done=Math.min(e.raw,capPerTl);
    let rep=0;Object.keys(e.pairs).forEach(function(p){if(e.pairs[p]>1)rep+=e.pairs[p];});
    e.rep=Math.min(rep,e.raw);});

  // ---- 2. roll the clamped numbers up ----
  const out={};
  Object.keys(tl).forEach(function(te){
    const e=tl[te];
    const key=level==='tl'?te:level==='ados'?e.ados_email:e.zsm_email;
    const nm =level==='tl'?e.name:level==='ados'?e.ados:e.zsm;
    const g=out[key]=out[key]||{key:key,name:nm,cluster:level==='tl'?e.cluster:'',
      teams:0,done:0,raw:0,actions:0,closed:0,rep:0,reviewed:0,acc:0,rew:0,deep:0};
    g.teams++;g.done+=e.done;g.raw+=e.raw;g.actions+=e.actions;g.closed+=e.closed;g.rep+=e.rep;
    g.reviewed+=e.reviewed;g.acc+=e.acc;g.rew+=e.rew;g.deep+=e.deep;
  });
  return Object.keys(out).map(function(k){
    const g=out[k],expected=capPerTl*Math.max(1,g.teams);
    const closure=g.actions?Math.round(g.closed/g.actions*100):null;
    const repeat=g.raw?Math.min(100,Math.round(g.rep/g.raw*100)):0;
    const acceptance=g.reviewed?Math.round(g.acc/g.reviewed*100):null;
    const depth=g.raw?Math.round(g.deep/g.raw*100):0;
    // One number for "is the RCA work any good": mostly whether the auditor accepted it,
    // then whether the action it raised was actually closed, then whether the analysis went
    // deep, then whether the same failure keeps coming back. Null until someone reviews.
    const quality=g.reviewed
      ? Math.max(0,Math.min(100,Math.round(0.45*acceptance+0.25*(closure==null?100:closure)+0.15*depth+0.15*(100-repeat))))
      : null;
    return{key:g.key,name:g.name,cluster:g.cluster,teams:g.teams,done:g.done,expected:expected,days:issuedDays,
      completion:expected?Math.min(100,Math.round(g.done/expected*100)):0,
      actions:g.actions,closed:g.closed,closure:closure,repeat:repeat,
      reviewed:g.reviewed,accepted:g.acc,rework:g.rew,acceptance:acceptance,depth:depth,quality:quality};
  }).sort(function(a,b){return b.completion-a.completion||b.done-a.done;});
}
function rootFreq(){
  const mon=mtdMonth(),m={};
  (S.rcaLog||[]).filter(function(x){return String(x.audit_date||'').slice(0,7)===mon;}).forEach(function(x){
    const k=(x.category||'')+'|'+(x.reason||'');
    const e=m[k]=m[k]||{cat:x.category||'',root:x.reason||'',n:0,coach:0,sys:0};
    e.n++;if(x.fault==='system')e.sys++;else e.coach++;});
  const all=Object.keys(m).map(function(k){return m[k];}).sort(function(a,b){return b.n-a.n;});
  const tot=all.reduce(function(s,r){return s+r.n;},0)||1;
  all.forEach(function(r){r.share=Math.round(r.n/tot*1000)/10;});
  return all;
}

const csvOf=(head,rows)=>[head].concat(rows).map(function(r){return r.map(csvCell).join(',');}).join('\r\n');

  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},400);

// One file per question, and only the columns that answer it. The old MTD export stacked

       'acceptance_pct','root_cause_depth_pct','actions_assigned','actions_closed',
       'action_closure_pct','repeat_finding_pct','quality_score'],

function r3Walk(l){
  const t=RCA3[l.cat]||null,p=(S.audits[l.id]&&S.audits[l.id].r3)||[];
  const s1=t&&p.length>0?t.w[p[0]]:null;
  const s2=s1&&p.length>1?s1.y[p[1]]:null;
  const leaf=!!(s2&&(!s2.r||!s2.r.length));
  const root=leaf?s2.t:(s2&&p.length>2?s2.r[p[2]]:'');
  return{t:t,s1:s1,s2:s2,root:root||'',step:p.length,leaf:leaf};
}
const R3LBL=['What happened','Why','Root cause'];
function r3Block(l){
  const w=r3Walk(l);if(!w.t)return '';
  const chosen=[w.s1&&w.s1.t,w.s2&&w.s2.t,w.root];
  const opts=[w.t.w,w.s1&&w.s1.y,w.leaf?null:(w.s2&&w.s2.r)];
  const cap='font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:'+MUT(40)+';margin-bottom:5px';
  let out='';
  for(let i=0;i<3;i++){
    if(w.leaf&&i===2)break;
    if(chosen[i]){
      out+='<div><div style="'+cap+'">Step '+(i+1)+' \u00b7 '+R3LBL[i]+'</div>'+
        '<button data-act="r3back" data-v="'+i+'" style="background:none;border:none;padding:0;cursor:pointer;font-family:inherit;text-align:left;font-size:'+(i===2?'17px':'14.5px')+';font-weight:600;color:var(--color-text);border-bottom:1.5px solid var(--color-text);line-height:1.35">'+esc(chosen[i])+'</button></div>';
      continue;
    }
    const list=opts[i];if(!list)break;
    const btns=list.map(function(o,j){const txt=typeof o==='string'?o:o.t;
      return '<button data-act="r3" data-v="'+j+'" style="display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--color-divider);padding:11px 0;cursor:pointer;font-family:inherit;font-size:14px;line-height:1.45;color:var(--color-text)">'+esc(txt)+'</button>';}).join('');
    out+='<div><div style="'+cap+'">Step '+(i+1)+' \u00b7 '+R3LBL[i]+'</div>'+
      '<div style="font-family:var(--font-heading);font-size:18px;line-height:1.35;margin-bottom:8px">'+esc(w.t.q[i])+'</div>'+
      '<div style="border-top:1px solid var(--color-divider)">'+btns+'</div></div>';
    break;
  }
  return out;
}

// ---- call recording: local-first (IndexedDB), uploaded when a blob store is configured ----
let IDB=null;
function idb(){if(IDB)return IDB;IDB=new Promise((res,rej)=>{const q=indexedDB.open('ls_recordings',1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('r'))q.result.createObjectStore('r');};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});return IDB;}
async function idbPut(k,v){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('r','readwrite');t.objectStore('r').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
async function idbAll(){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('r','readonly'),s=t.objectStore('r'),out={},c=s.openCursor();c.onsuccess=e=>{const cur=e.target.result;if(!cur)return res(out);out[cur.key]=cur.value;cur.continue();};c.onerror=()=>rej(c.error);});}
async function idbDel(k){const db=await idb();return new Promise(res=>{const t=db.transaction('r','readwrite');t.objectStore('r').delete(k);t.oncomplete=res;});}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('r','readonly'),q=t.objectStore('r').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error);});}
async function hydrateRecs(){try{const all=await idbAll();Object.keys(all).forEach(k=>{const r=all[k];S.recs[k]={name:r.name,size:r.size,url:r.url||URL.createObjectURL(r.blob),remote:!!r.url,at:r.at};});if(Object.keys(all).length)render();}catch(e){}}
const kb=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';

async function recPick(input,leadId){
  const f=input.files&&input.files[0];input.value='';if(!f)return;
  S.recBusy=leadId;render();
  const url=URL.createObjectURL(f);
  const rec={name:f.name,size:f.size,url,remote:false,at:new Date().toISOString()};
  S.recs[leadId]=rec;
  try{await idbPut(leadId,{name:f.name,size:f.size,blob:f,at:rec.at});}catch(e){}
  try{
    const r=await fetch('/api/recording?lead='+encodeURIComponent(leadId)+'&name='+encodeURIComponent(f.name),
      {method:'POST',headers:Object.assign({'Content-Type':f.type||'application/octet-stream'},authHeaders()),body:f});
    if(r.ok){const j=await r.json();rec.remote=true;rec.url=j.url;try{await idbPut(leadId,{name:f.name,size:f.size,url:j.url,at:rec.at});}catch(e){}}
    else{
      // 501 = no blob store on this deployment. The file is safe in IndexedDB, but it is
      // on THIS DEVICE ONLY — say so, because a silent local-only save looks identical to
      // a successful upload and the TL would never know Quality cannot hear the call.
      const j=await r.json().catch(()=>({}));
      rec.localOnly=true;
      rec.warn=r.status===501?'Saved on this device only — recording storage is not set up, so an auditor cannot hear this call.'
        :('Upload failed ('+(j.error||('HTTP '+r.status))+') — saved on this device only.');
      if(r.status===404)rec.noServer=true;
    }
  }catch(e){}
  S.recBusy=null;render();
}
async function recDrop(leadId){delete S.recs[leadId];await idbDel(leadId);render();}

function adherView(){
  const total=L().length,done=audited(),miss=total-done;
  const actionsSet=L().filter(l=>{const x=S.audits[l.id];return x&&x.reason&&x.action&&x.action!=='No action needed';}).length;
  const hi=L().filter(l=>{const x=S.audits[l.id];return x&&x.reason&&x.fault==='system';}).length;
  const mtd=mtdStats();
  const stat=(v,lbl,s,icon,tone)=>`<div>
    <div style="display:flex;align-items:center;gap:8px">${icon?ic(icon,17,tone||MUT(38)):''}<div style="font-family:var(--font-heading);font-size:40px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums">${v}</div></div>

  const LRMs=R().map(r=>{const mine=L().filter(l=>l.LRM===r.name),sd=mine.filter(l=>rcaDone(l.id)).length;

// ---- MTD score ----
// One headline number — % of audits done till date — with the two follow-ons that say

const LVLS=[['tl','By team lead'],['ados','By ADOS'],['zsm','By ZSM']];

  const th='text-align:left;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:'+MUT(45)+';font-weight:600;padding:0 16px 9px 0;white-space:nowrap';

function buildDir(){
  const H=S.hier||[];const tl=new Map(),zsm=new Map(),ados=new Map();
  H.forEach(h=>{if(h.tl_email)tl.set(h.tl_email,h.tl_name||nameFromEmail(h.tl_email));
    if(h.zsm_email)zsm.set(h.zsm_email,h.zsm_name||nameFromEmail(h.zsm_email));
    if(h.ados_email)ados.set(h.ados_email,h.ados_name||nameFromEmail(h.ados_email));});
  const rows=[];
  ados.forEach((n,e)=>rows.push({name:n,email:e,role:'ADOS',team:H.filter(h=>h.ados_email===e).length}));
  zsm.forEach((n,e)=>rows.push({name:n,email:e,role:'ZSM',team:H.filter(h=>h.zsm_email===e).length}));
  tl.forEach((n,e)=>rows.push({name:n,email:e,role:'TL',team:H.filter(h=>h.tl_email===e).length}));
  H.forEach(h=>rows.push({name:h.lrm_name||nameFromEmail(h.lrm_email),email:h.lrm_email,role:'LRM',team:0}));
  return{rows,ados:ados.size,zsm:zsm.size,tl:tl.size,lrm:H.length};
}

// ---- events ----
function patch(id,o){S.audits[id]=Object.assign({reason:'',sev:'',note:'',action:'No action needed',submitted:false,at:''},S.audits[id],o);}
// Submitting is a deliberate act, not a side effect of typing: the RCA stays a draft until
// the TL presses Submit. That press is what gets logged and what "done" counts.
function submitRca(id){
  const a=S.audits[id]||{};
  if(!a.reason||!a.action||!a.owner||!a.fault)return;
  const d=new Date(),hh=d.getHours()%12||12,ap=d.getHours()<12?'AM':'PM';
  patch(id,{submitted:true,at:hh+':'+String(d.getMinutes()).padStart(2,'0')+' '+ap});
  queueRca(id);
  const dl=catLeads(S.catKey),i=dl.findIndex(x=>x.id===id);
  for(let k=1;k<=dl.length;k++){const j=(i+k)%dl.length;if(!rcaDone(dl[j].id)){S.selId=dl[j].id;break;}}
  render();
}
function patchRv(id,o){S.rcaReview[id]=Object.assign({verdict:null,note:'',assignee:'',notified:false},S.rcaReview[id],o);}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const act=t.dataset.act,v=t.dataset.v;
  if(act==='nav'){S.screen=v;render();}
  else if(act==='diag'){loadDiag();}
  else if(act==='sampleRole'){if(SAMPLE&&v!==S.role)applySample(v);}
  else if(act==='signout'){signOut();}
  else if(act==='rules'){S.showRules=!S.showRules;render();}
  else if(act==='cat'){S.catKey=v;S.selId=(catLeads(v)[0]||{}).id;render();}
  else if(act==='lead'){S.selId=v;render();}
  else if(act==='sev'){patch(S.selId,{sev:v});render();}
  else if(act==='r3'){const l=L().find(x=>x.id===S.selId);if(!l)return;const p=((S.audits[S.selId]&&S.audits[S.selId].r3)||[]).slice();p.push(+v);patch(S.selId,{r3:p});patch(S.selId,{reason:r3Walk(l).root||''});render();}
  else if(act==='r3back'){const p=((S.audits[S.selId]&&S.audits[S.selId].r3)||[]).slice(0,+v);patch(S.selId,{r3:p,reason:''});render();}
  else if(act==='owner'){patch(S.selId,{owner:v});render();}
  else if(act==='fault'){patch(S.selId,{fault:v});render();}
  else if(act==='mtdLvl'){S.mtdLvl=v;render();}
  else if(act==='exportCsv'){exportCsv(v);}
  else if(act==='actDone'){const p=String(v).split('|');setActionStatus(p[0],p[1],p[2]);}
  else if(act==='actFilter'){S.actFilter=v;render();}
  else if(act==='submitRca'){submitRca(S.selId);}
  else if(act==='reopen'){patch(S.selId,{submitted:false});render();}
  else if(act==='prev'){const dl=catLeads(S.catKey),i=dl.findIndex(x=>x.id===S.selId);S.selId=dl[(i-1+dl.length)%dl.length].id;render();}
  else if(act==='next'){const dl=catLeads(S.catKey),i=dl.findIndex(x=>x.id===S.selId);for(let k=1;k<=dl.length;k++){const j=(i+k)%dl.length;if(!rcaDone(dl[j].id)){S.selId=dl[j].id;render();return;}}S.selId=dl[(i+1)%dl.length].id;render();}
  else if(act==='rcaRange'){S.rcaRange=v;S.rcaTouched={};render();}
  else if(act==='rcaFilter'){S.rcaFilter=v;S.rcaTouched={};render();}
  else if(act==='rcaAccept'){const cur=S.rcaReview[v]||{};S.rcaTouched=Object.assign({},S.rcaTouched,{[v]:true});patchRv(v,{verdict:cur.verdict==='accept'?null:'accept',saved:false});saveReview(v);}
  else if(act==='rcaRework'){const cur=S.rcaReview[v]||{};S.rcaTouched=Object.assign({},S.rcaTouched,{[v]:true});patchRv(v,{verdict:cur.verdict==='rework'?null:'rework',saved:false});saveReview(v);}
  else if(act==='rcaNotify'){patchRv(v,{notified:true});saveReview(v);}
  else if(act==='accessFilter'){S.accessFilter=v;render();}
  else if(act==='setTab'){S.setTab=v;S.mapErr='';S.mapMsg='';render();}
  else if(act==='mapFilter'){S.mapFilter=v;render();}
  else if(act==='mapClear'){saveMapping([{lrm_email:v,clear:true}]);}
  else if(act==='unmapAll'){const l=S.unmapped||[],sel=S.mapSel||{},n=Object.keys(sel).filter(k=>sel[k]).length;
    S.mapSel={};if(n!==l.length)l.forEach(u=>{const e=norm(u.lrm_email);if(e)S.mapSel[e]=true;});render();}
  else if(act==='bulkAssign'){
    const sel=S.mapSel||{},tl=S.mapBulkTl||'';
    const ids=Object.keys(sel).filter(k=>sel[k]&&k.indexOf('@')>=0);
    if(!tl||!ids.length)return;
    const chain=chainFor(tl),src=(S.unmapped||[]);
    saveMapping(ids.map(e=>{const u=src.find(x=>norm(x.lrm_email)===e)||{};
      return Object.assign({lrm_email:e,lrm_name:u.lrm_name||'',cluster:u.cluster||''},chain);}));
  }
  else if(act==='accessAdd'){const e=(S.newAccessEmail||'').trim();if(e){saveAccess(e,S.newAccessRole||'auditor');S.newAccessEmail='';}}
});
document.addEventListener('change',e=>{const t=e.target.closest('[data-act]');if(!t)return;
  if(t.dataset.act==='reason'){patch(S.selId,{reason:t.value});if(t.value&&!(S.audits[S.selId]&&S.audits[S.selId].sev))patch(S.selId,{sev:'med'});render();}
  else if(t.dataset.act==='action'){patch(S.selId,{action:t.value});render();}
  else if(t.dataset.act==='rcaAssignee'){patchRv(t.dataset.v,{assignee:t.value,notified:false,saved:false});saveReview(t.dataset.v);}
  // The auditor's note is shared state too — commit it on blur, not on every keystroke.
  else if(t.dataset.act==='rcaNote'){saveReview(t.dataset.v);}
  else if(t.dataset.act==='mapTl'){
    const e=t.dataset.v;
    if(e.indexOf('@')<0){S.mapErr='That lead record carries no LRM email, so it cannot be mapped. Fix the email in the CRM first.';render();return;}
    const u=(S.unmapped||[]).find(x=>norm(x.lrm_email)===e)||{};
    saveMapping([Object.assign({lrm_email:e,lrm_name:u.lrm_name||'',cluster:u.cluster||''},chainFor(t.value))]);
  }
  else if(t.dataset.act==='bulkTl'){S.mapBulkTl=t.value;render();}
  else if(t.dataset.act==='unmapSel'){S.mapSel=Object.assign({},S.mapSel,{[t.dataset.v]:t.checked});render();}
});
document.addEventListener('input',e=>{const t=e.target.closest('[data-act]');if(!t)return;
  if(t.dataset.act==='note'){S.audits[S.selId]=Object.assign({},S.audits[S.selId],{note:t.value});}
  else if(t.dataset.act==='rcaNote'){S.rcaReview[t.dataset.v]=Object.assign({verdict:null,assignee:'',notified:false},S.rcaReview[t.dataset.v],{note:t.value,saved:false});}
  else if(t.dataset.act==='auditorInput'){S.newAuditor=t.value;}
  else if(t.dataset.act==='dirSearch'){S.dirQ=t.value;renderKeepFocus('[data-act="dirSearch"]');}
  else if(t.dataset.act==='mapSearch'){S.mapQ=t.value;renderKeepFocus('[data-act="mapSearch"]');}
  else if(t.dataset.act==='accessRole'){saveAccess(t.dataset.v,t.value);}
  else if(t.dataset.act==='accessNewRole'){S.newAccessRole=t.value;}
  else if(t.dataset.act==='accessNewEmail'){S.newAccessEmail=t.value;}
});
document.addEventListener('keydown',e=>{const t=e.target.closest&&e.target.closest('[data-act="accessNewEmail"]');if(t&&e.key==='Enter'){e.preventDefault();const em=(t.value||'').trim();if(em)saveAccess(em,S.newAccessRole||'auditor');S.newAccessEmail='';}});

setInterval(tickTimers,1000);
setInterval(flushRca,20000);
load();
hydrateRecs();
</script>
</body>
</html>
