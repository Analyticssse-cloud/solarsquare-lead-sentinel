<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Sentinel</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<style>
  body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)}
  a{color:var(--color-accent)}
  a:hover{color:var(--color-accent-700)}
  .wrap{max-width:1280px;margin:0 auto;padding:0 30px}
  .ls-scroll::-webkit-scrollbar{height:8px}
  .ls-scroll::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--color-text) 18%,transparent);border-radius:999px}
  select.input{appearance:none;-webkit-appearance:none;cursor:pointer}
  button{font-family:var(--font-body)}
  @keyframes lsfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* depth + state: the page stays paper, but a row you can act on lifts under the cursor */
  .ls-row{transition:background .13s ease,box-shadow .13s ease,padding-left .13s ease}
  .ls-row:hover{background:color-mix(in srgb,var(--color-text) 3.5%,transparent)}
  .ls-row[data-on="1"]{background:var(--color-bg);box-shadow:var(--shadow-sm)}
  .ls-cat{transition:background .13s ease}
  .ls-cat:hover{background:color-mix(in srgb,var(--color-text) 4%,transparent)}
  .ls-badge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.07em;
            text-transform:uppercase;font-weight:600;padding:3px 9px;border-radius:2px;white-space:nowrap;line-height:1.5}
  .ls-bar{display:block;height:3px;width:100%;background:color-mix(in srgb,var(--color-text) 11%,transparent);
          border-radius:999px;overflow:hidden}
  .ls-bar>i{display:block;height:100%;border-radius:999px;transition:width .45s cubic-bezier(.2,.7,.3,1)}
  .ls-lift{transition:box-shadow .15s ease,transform .15s ease}
  .ls-lift:hover{box-shadow:var(--shadow-md)}
  .ls-btn{cursor:pointer;font-family:inherit;border-radius:2px;transition:background .13s ease,color .13s ease,border-color .13s ease}
  .ls-btn-solid{border:1px solid var(--color-text);background:var(--color-text);color:var(--color-bg)}
  .ls-btn-solid:hover{background:var(--color-accent);border-color:var(--color-accent)}
  .ls-btn-ghost{border:1px solid color-mix(in srgb,var(--color-text) 22%,transparent);background:none;color:var(--color-text)}
  .ls-btn-ghost:hover{border-color:var(--color-accent);color:var(--color-accent-700)}
  button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{
    outline:2px solid var(--color-accent);outline-offset:2px}
  i[class^="ph-"],i[class*=" ph-"]{line-height:1;flex:none}
  .ls-3col{display:grid;grid-template-columns:216px 278px minmax(0,1fr);gap:40px;align-items:start;padding-top:14px}
  .ls-rail{position:sticky;top:18px}
  @media (max-width:1180px){.ls-3col{grid-template-columns:198px 244px minmax(0,1fr);gap:24px}}
  @media (max-width:960px){.ls-3col{grid-template-columns:1fr;gap:26px}.ls-rail{position:static}}
  .ls-rules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:34px;padding:6px 0 34px;max-width:1100px}
  @media (max-width:900px){.ls-rules{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .ls-trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
</style>
</head>
<body>
<div id="app" style="min-height:100vh;background:radial-gradient(130% 90% at 92% -20%, var(--color-accent-100) 0%, var(--color-bg) 55%)"></div>

<script>
// Five categories, two accents. Each badge uses ONE ramp — magenta for a leak that has
// already cost a meeting, cyan for a leak still recoverable, neutral for watch-only.
const CATC={
 mcch_past:      {tone:'var(--color-accent-2)',    tint:'var(--color-accent-2-100)',ink:'var(--color-accent-2-800)',icon:'ph-calendar-x'},
 followup_missed:{tone:'var(--color-accent-2-400)',tint:'var(--color-accent-2-100)',ink:'var(--color-accent-2-700)',icon:'ph-phone-x'},
 not_interested: {tone:'var(--color-accent-700)',  tint:'var(--color-accent-100)',  ink:'var(--color-accent-800)',  icon:'ph-hand-palm'},
 not_qualified:  {tone:'var(--color-accent)',      tint:'var(--color-accent-100)',  ink:'var(--color-accent-800)',  icon:'ph-funnel-x'},
 mcch_future:    {tone:'color-mix(in srgb,var(--color-text) 45%,transparent)',
                  tint:'color-mix(in srgb,var(--color-text) 7%,transparent)',
                  ink:'color-mix(in srgb,var(--color-text) 78%,transparent)',icon:'ph-calendar-check'},
};
const CATS=[
 {key:'mcch_past',name:'Meeting confirmed · date passed',short:'MCCH past',dot:'#1668b3',
  check:'The confirmed meeting (MCCH) date is before today, but the lead is still at MCCH — the meeting was never moved to MD and no fresh date was set. A stuck MCCH is a silent MD leak.',
  reasons:['Meeting not marked MD despite date passing','No reschedule after no-show','Stuck at MCCH >48h post-meeting','Customer met but stage not updated']},
 {key:'followup_missed',name:'Follow-up overdue',short:'Follow-up',dot:'#2f9e8f',
  check:'Follow-up date (CNC / call-later / meeting-postponed) is today or earlier, but no connect attempt is logged today. Every day cold lowers Lead→MS conversion.',
  reasons:['No connect attempt logged today','Follow-up date not honoured','No new follow-up date set','Reassigned but not actioned']},
 {key:'not_interested',name:'Marked not interested',short:'Not int.',dot:'#e0821a',
  check:'Lead was closed as Not Interested — the real objection was not captured / handled, or it was set to lost prematurely (before MD).',
  reasons:['Objection not handled','No reason / objection logged','Closed before MD (too early)','No win-back attempt']},
 {key:'not_qualified',name:'Marked not qualified',short:'Not qual.',dot:'#0d3c66',
  check:'Lead was closed as Not Qualified — a discovery call did not happen or the disqualification criteria do not genuinely apply.',
  reasons:['No discovery call logged','Qualification criteria not applied','Reason code missing','Reopen candidate']},
 {key:'mcch_future',name:'Meeting confirmed · upcoming',short:'MCCH ahead',dot:'#6aa9dd',
  check:'Meeting (MCCH) is confirmed for a future date but the slot is outside the D+2 window, the customer confirmation is missing, or prep was not done.',
  reasons:['Customer confirmation not logged','Slot beyond D+2 window','No prep note sent to customer','Held / duplicate slot']},
];
const ACTIONS=['No action needed','Re-open the lead','Reassign to another LRM','Ask LRM to call today','Escalate to manager'];
const SEVS=[['low','Low'],['med','Medium'],['high','High']];
const SEVMETA={low:['Low sev','background:var(--color-accent-2-100);color:var(--color-accent-2-800)'],med:['Med sev','background:var(--color-accent-100);color:var(--color-accent-800)'],high:['High sev','background:var(--color-accent-200);color:var(--color-accent-800)']};
const RULES=[
 ['1','Pool','Every lead where a breach condition fired in the last 30 days, up to today.'],
 ['2','Eligibility','Category rule applied, minus anything RCA-ed in the last 7 days — a cooldown so leads keep rotating.'],
 ['3','Severity score','60% breach urgency + 40% LRM deviation risk → P1 / P2 / P3.'],
 ['4','Daily pick','Top 4 per category, LRM-balanced and seeded to the date so the pull is reproducible.'],
];
const MTD=null; // month-to-date adherence needs a shared RCA history store; never fake it
// 5-Why decision trees. WHYS[cat](lead) returns the opening node; every option either
// branches to a follow-up node (`to`) or terminates at a root cause (`root`).
const WHYS={
  mcch_past:l=>{const d=l.days||0;return{
    q:'This meeting was due '+(d?d+' day'+(d===1?'':'s')+' ago':'earlier')+' and the lead is still at MCCH. Why has it not moved to MD?',
    a:[
      {t:'The meeting never took place',to:{q:'Why did the confirmed meeting not happen?',a:[
        {t:'Customer no-showed',to:{q:'Why has it not been rescheduled since the no-show?',a:[
          {t:'LRM made no attempt to reconnect',to:{q:'Why did the LRM not attempt a reschedule?',a:[
            {t:'Lead deprioritised vs newer leads',root:'Reschedule deprioritised — LRM prioritisation gap'},
            {t:'No task/reminder surfaced it',root:'No system reminder to reschedule after no-show'}]}},
          {t:'Customer stopped responding',root:'Customer unresponsive after no-show — no win-back cadence'}]}},
        {t:'LRM missed / double-booked the slot',root:'LRM missed the confirmed meeting slot'},
        {t:'It was never a genuine confirmation',root:'MCCH marked without real customer confirmation'}]}},
      {t:'The meeting happened but stage was not updated',to:{q:'Why was the stage not moved to MD after the meeting?',a:[
        {t:'LRM forgot / deprioritised the update',to:{q:'Why was the stage update missed?',a:[
          {t:'No end-of-meeting update habit',root:'Meeting done, stage not updated — process discipline'},
          {t:'Unsure which stage applied',root:'Outcome logged incorrectly — stage-knowledge gap'}]}},
        {t:'Outcome unclear, LRM is waiting',root:'Ambiguous outcome — lead parked at MCCH'}]}},
      {t:'Customer postponed the meeting',to:{q:'Why was a fresh meeting date not captured?',a:[
        {t:'No new date taken at postponement',root:'Postponed with no fresh MCCH date set'},
        {t:'Customer went cold after postponing',root:'Postponed then unresponsive — no follow-up cadence'}]}}]};},
  followup_missed:l=>{const d=l.days||0;return{
    q:d>0?('The follow-up is '+d+' day'+(d===1?'':'s')+' overdue with no attempt logged. Why was it not made?'):'The follow-up is due today and no attempt is logged yet. Why has the LRM not connected?',
    a:[
      {t:'LRM made no attempt to contact',to:{q:'Why was no attempt made?',a:[
        {t:'Lead slipped out of the day plan',to:{q:'Why did it slip out of the plan?',a:[
          {t:'No task/reminder surfaced it',root:'No reminder surfaced the due follow-up'},
          {t:'Too many leads, ran out of time',root:'LRM capacity exceeded — follow-up not reached'}]}},
        {t:'LRM chose to prioritise other leads',root:'Follow-up deprioritised vs other leads'}]}},
      {t:'LRM tried but could not reach the customer',to:{q:'Why was the attempt not logged or a new date not set?',a:[
        {t:'Attempt made but not logged in CRM',root:'Contact attempted but not logged (data gap)'},
        {t:'Reached, but no new follow-up date set',root:'No fresh follow-up date set after contact'}]}},
      {t:'The follow-up date was stale / wrong',to:{q:'Why was the follow-up date not honoured?',a:[
        {t:'Date set by default, no real commitment',root:'Follow-up date set without real commitment'},
        {t:'Reassigned LRM never picked it up',root:'Reassigned lead not actioned by new LRM'}]}}]};},
  not_interested:l=>({
    q:l.sit==='met'?'This lead was marked Not Interested after a meeting was confirmed. Why was it closed as NI?':'This lead was marked Not Interested before any meeting (MD). Why was it closed this early?',
    a:[
      {t:'The real objection was not handled',to:{q:'Why was the objection not handled?',a:[
        {t:'Objection was not captured / logged',to:{q:'Why was the objection not captured?',a:[
          {t:'LRM did not probe the reason',root:'Objection not probed — discovery gap'},
          {t:'Captured verbally, never logged',root:'Objection handled but not logged (data gap)'}]}},
        {t:'LRM had no rebuttal / offer',root:'Objection known but no rebuttal attempted'}]}},
      {t:'Closed too early — before a real pitch',to:{q:'Why was it closed before MD?',a:[
        {t:'LRM judged low intent quickly',root:'Premature close — intent misjudged, no MD'},
        {t:'Pressure to clear the pipeline',root:'Pipeline-hygiene pressure — closed prematurely'}]}},
      {t:'Genuinely not interested, but no win-back',to:{q:'Why was there no win-back attempt?',a:[
        {t:'No win-back cadence exists',root:'Valid NI but no win-back attempt'},
        {t:'Marked lost and dropped immediately',root:'Closed and dropped — no nurture path'}]}}]}),
  not_qualified:l=>({
    q:l.sit==='disc'?'This lead was marked Not Qualified after a discovery call. Why does it not qualify?':'This lead was marked Not Qualified with no discovery call logged. Why was it disqualified without discovery?',
    a:[
      {t:'No discovery call actually happened',to:{q:'Why was there no discovery call?',a:[
        {t:'LRM disqualified on assumption',root:'Disqualified on assumption — no discovery call'},
        {t:'Could not reach customer to qualify',to:{q:'Why was reaching the customer not retried?',a:[
          {t:'No retry cadence attempted',root:'Unreachable for discovery — no retry cadence'},
          {t:'Wrong / bad contact details',root:'Bad contact data — could not qualify'}]}}]}},
      {t:'The DQ criteria do not really apply',to:{q:'Why were the criteria mis-applied?',a:[
        {t:'Criteria misunderstood by LRM',root:'DQ criteria misunderstood — training gap'},
        {t:'Reason code missing / wrong',root:'DQ reason code missing or incorrect'}]}},
      {t:'It qualifies but was closed anyway',root:'Reopen candidate — lead actually qualifies'}]}),
  mcch_future:l=>({
    q:'A meeting is confirmed for an upcoming date but the entry is flagged. Why is this MCCH not clean?',
    a:[
      {t:'Customer confirmation is not logged',to:{q:'Why is the confirmation missing?',a:[
        {t:'LRM set MCCH without customer OK',root:'MCCH set without customer confirmation'},
        {t:'Confirmed verbally, not recorded',root:'Customer confirmed but not logged (data gap)'}]}},
      {t:'The slot is beyond the D+2 window',to:{q:'Why was the slot booked so far out?',a:[
        {t:'Customer only available later',root:'Slot beyond D+2 — customer availability'},
        {t:'LRM pushed the slot to manage load',root:'Slot beyond D+2 — LRM scheduling to ease load'}]}},
      {t:'Prep note was not sent',to:{q:'Why was prep not done?',a:[
        {t:'No prep step in the LRM routine',root:'No meeting-prep note sent to customer'},
        {t:'Held / duplicate slot',root:'Held or duplicate slot — needs cleanup'}]}}]}),
};
const DEFAULT_AUDITORS=['quality.desk@solarsquare.in'];
const ADMIN_FALLBACK=['analytics.sse@solarsquare.in'];
const adminEmails=()=>AUTH.admins&&AUTH.admins.length?AUTH.admins:ADMIN_FALLBACK;
const nameFromEmail=e=>{const s=String(e||'').split('@')[0];return s.split(/[._]+/).filter(Boolean).map(w=>w[0].toUpperCase()+w.slice(1)).join(' ')||e;};
const ROLECLS={ADOS:'tag tag-accent-2',ZSM:'tag tag-accent',TL:'tag tag-outline',LRM:'tag tag-neutral'};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function fmtLongDate(s){if(!s)return'';const d=new Date(String(s).slice(0,10)+'T00:00:00');return isNaN(d)?'':DOW[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear();}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=e=>String(e||'').trim().toLowerCase().replace('@homes.solarsquare.in','@solarsquare.in');
const ini2=n=>{const p=String(n||'').trim().split(/\s+/);return((p[0]&&p[0][0]||'')+(p[1]&&p[1][0]||'')).toUpperCase();};
const first1=n=>String(n||'').split(' ')[0];
const fmtD=iso=>{if(!iso)return'';const d=new Date(iso);return isNaN(d)?'':d.getDate()+' '+MON[d.getMonth()];};
const fmtDT=iso=>{if(!iso)return'\u2014';const d=new Date(iso);if(isNaN(d))return'\u2014';let h=d.getHours(),m=String(d.getMinutes()).padStart(2,'0'),ap=h<12?'AM':'PM';h=h%12||12;return d.getDate()+' '+MON[d.getMonth()]+', '+h+':'+m+' '+ap;};
const ACTLBL={call:'Call logged',stage_change:'Stage changed',meeting_done:'Meeting marked done',followup_set:'Follow-up set',crm_touch:'CRM record edited',none:'No activity ever recorded'};
const LEAKLBL={L1:'Meeting date passed, nothing since',L2:'Marked CNC, never re-dialled',L3:'Call-later loop turning, no close',L4:'Closed with no connected call',L4b:'Closed \u2014 check the reason',L0:'Watch only'};const silentLbl=l=>{if(l.lastAt==null)return'never touched';const h=l.hoursSilent||0;if(h<24)return h<=1?'active this hour':h+'h silent';return (l.silent||Math.round(h/24))+'d silent';};
const catObj=k=>CATS.find(c=>c.key===k);

const S={screen:'queue',recs:{},recBusy:null,rcaLog:[],rcaPending:0,rcaErr:'',diag:null,diagState:'',access:null,accessBusy:'',accessErr:'',accessFilter:'all',newAccessEmail:'',newAccessRole:'auditor',
  setTab:'access',mapping:null,unmapped:[],mapBusy:'',mapErr:'',mapMsg:'',mapQ:'',mapFilter:'overridden',mapSel:{},mapBulkTl:'',auditRaw:'',auditDate:'',tlEmail:null,catKey:'mcch_past',selId:null,audits:{},rcaReview:{},showRules:false,model:null,src:'live',role:'tl',user:null,meEmail:null,hier:[],rcaAuditors:null,newAuditor:'',dirQ:''};

const AUTH={enabled:true,ready:false,clientId:'',domain:'solarsquare.in',admins:[]};
const LOGO_SRC='https://cdn.solarsquare.in/blog/wp-content/uploads/2025/11/05101757/logo.webp';
function logoImg(h){return '<img src="'+LOGO_SRC+'" alt="SolarSquare" style="height:'+h+'px;width:auto;display:block" onerror="logoFallback(this,'+h+')">';}
function logoFallback(el,h){const fs=Math.round(h*0.66);el.outerHTML='<span style="font-family:var(--font-heading);font-size:'+fs+'px;font-weight:600;letter-spacing:-.01em;color:var(--color-text)">Solar<span style="color:var(--color-accent)">Square</span></span>';}
const ROLE_LABEL={tl:'Team Lead',zsm:'Zonal Manager',ados:'ADOS',admin:'Admin',auditor:'RCA auditor',blocked:'No access',none:'No team mapped'};
function readSession(){try{return JSON.parse(localStorage.getItem('ls_auth')||'null');}catch(e){return null;}}
function saveSession(o){try{localStorage.setItem('ls_auth',JSON.stringify(o));}catch(e){}}
function signOut(){try{if(window.google&&google.accounts&&google.accounts.id)google.accounts.id.disableAutoSelect();}catch(e){}localStorage.removeItem('ls_auth');location.reload();}
function decodeJwt(t){try{const b=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(b))));}catch(e){return{};}}
function authHeaders(){const a=readSession();return a&&a.token?{Authorization:'Bearer '+a.token}:{};}
let gisReady=null;
function loadGis(){if(gisReady)return gisReady;gisReady=new Promise(res=>{if(window.google&&google.accounts)return res(true);const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=1;s.defer=1;s.onload=()=>res(true);s.onerror=()=>res(false);document.head.appendChild(s);});return gisReady;}
function authMsg(html){const el=document.getElementById('autherr');if(el)el.innerHTML=html||'';}
function handleCredential(resp){const c=decodeJwt(resp.credential);const em=(c.email||'').toLowerCase();if(AUTH.domain&&c.hd!==AUTH.domain&&!em.endsWith('@'+AUTH.domain)){authMsg('Signed in as <b>'+esc(em||'?')+'</b> — that isn\u2019t an @'+esc(AUTH.domain)+' account. Sign in with your SolarSquare login.');return;}saveSession({name:c.name||'',email:c.email||'',picture:c.picture||'',token:resp.credential});location.reload();}
async function renderGoogleBtn(el){
  const ok=await loadGis();
  if(!ok){authMsg('Could not reach Google Sign-In (network/adblock). Check your connection and reload.');return;}
  if(!el||!window.google)return;
  if(!AUTH.clientId){authMsg('Sign-in isn\u2019t configured yet — <code>GOOGLE_CLIENT_ID</code> is not set on the server.');return;}
  try{
    google.accounts.id.initialize({client_id:AUTH.clientId,callback:handleCredential,hd:AUTH.domain,
      error_callback:e=>{authMsg('Google rejected sign-in: <b>'+esc((e&&(e.type||e.message))||'unknown')+'</b>. If this says <i>origin</i>, this site\u2019s URL must be added to the OAuth client\u2019s <b>Authorized JavaScript origins</b> in Google Cloud Console.');}});
    el.innerHTML='';
    google.accounts.id.renderButton(el,{theme:'outline',size:'large',shape:'rectangular',text:'signin_with',logo_alignment:'center',width:360});
    google.accounts.id.prompt(n=>{if(n&&n.isSkippedMoment&&n.isSkippedMoment()){/* one-tap skipped; button still works */}});
  }catch(err){authMsg('Sign-in init failed: <b>'+esc(String(err&&err.message||err))+'</b>');}
}
async function initAuth(){
  try{const r=await fetch('/api/config',{cache:'no-store'});if(r.ok){const c=await r.json();AUTH.enabled=!!c.enabled;AUTH.clientId=c.clientId||'';AUTH.domain=(c.allowedDomain||AUTH.domain||'').toLowerCase();AUTH.admins=c.admins||[];}else{AUTH.enabled=false;}}
  catch(e){AUTH.enabled=false;}
  AUTH.ready=true;
}
function loginView(denied,reason){
  const em=denied&&readSession()?esc(readSession().email):'';
  const rmap={'not-signed-in':'Your session expired. Sign in again.','invalid-token':'Your sign-in expired (tokens last ~1 hour). Sign in again.','wrong-audience':'Server GOOGLE_CLIENT_ID doesn\u2019t match the one issuing your login — the two client IDs must be identical.','wrong-domain':'That account isn\u2019t on the allowed Workspace domain.','not-authorized':'Your email isn\u2019t on the ALLOWED_EMAILS allowlist. Ask an admin to add you.','email-unverified':'Your Google email isn\u2019t verified.'};
  const rmsg=reason?(rmap[reason]||('Server said: '+esc(reason))):'';
  document.getElementById('app').innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:40px 24px">
    <div style="width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;text-align:center">
      <div style="margin-bottom:36px">${logoImg(52)}</div>
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:14px">
        <span style="width:52px;height:52px;flex:none;border-radius:999px;background:var(--color-accent);display:grid;place-items:center"><span style="width:21px;height:21px;border-radius:999px;border:5px solid var(--color-bg)"></span></span>
        <span style="font-family:var(--font-heading);font-size:44px;line-height:1;letter-spacing:-.015em">Lead Sentinel</span>
      </div>
      <div style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:${MUT(42)};margin-bottom:28px">Conversion Desk · Audit</div>
      <div style="width:56px;height:1px;background:${MUT(18)};margin-bottom:28px"></div>
      <div style="font-size:15px;line-height:1.6;color:${MUT(62)};max-width:36ch;margin-bottom:32px">${denied?`<b>${em}</b> isn't authorised for Lead Sentinel.<br>Sign in with a mapped TL or manager account, or ask an admin for access.`:'Sign in with your SolarSquare account to open today’s audit queue.'}</div>
      <div id="gbtn" style="min-height:48px;display:grid;place-items:center;width:100%"></div>
      <div id="autherr" style="font-size:12.5px;line-height:1.55;color:var(--color-accent-2-700);max-width:360px;margin-top:16px">${rmsg}</div>
      ${denied?`<button class="btn btn-secondary" onclick="signOut()" style="font-size:12.5px;margin-top:16px">Use a different account</button>`:''}
      <div style="font-size:12px;color:${MUT(42)};margin-top:36px">Restricted to @${esc(AUTH.domain)} accounts</div>
    </div></div>`;
  renderGoogleBtn(document.getElementById('gbtn'));
}

function errorView(why){
  const w=why||{};
  const diag={
    no_server:['No API on this host','<code>/api/queue</code> returned 404. Serverless routes only run on the deployed Vercel app — this is expected in a local preview.'],

function fetchT(url,ms,headers){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||3500);return fetch(url,{signal:c.signal,headers:headers||{}}).finally(()=>clearTimeout(t));}
async function load(){
  if(SAMPLE){applySample(SAMPLE_ROLE);return;}
  await initAuth();
  const sess=readSession();
  if(AUTH.enabled&&!sess){return loginView(false);}
  document.getElementById('app').innerHTML='<div class="wrap" style="padding-top:80px;text-align:center;color:'+MUT(55)+';font-size:14px">Loading Lead Sentinel…</div>';
  let data=null,fail={kind:'net'};
  // One retry: the first call after a deploy pays the cold start and can outrun the budget,
  // while the second lands on a warm function with the response already cached.
  for(let attempt=0;attempt<2&&!data;attempt++){
    if(attempt)document.getElementById('app').innerHTML='<div class="wrap" style="padding-top:80px;text-align:center;color:'+MUT(55)+';font-size:14px">Still loading — the first request after a deploy is slow…</div>';
    try{const r=await fetchT('/api/queue',attempt?90000:45000,authHeaders());
      if(r.status===401||r.status===403){let reason='';try{reason=(await r.json()).error||'';}catch(e){}return loginView(true,reason);}
      if(r.status===404){fail={kind:'no_server'};break;}
      else if(!r.ok){let d='';try{d=(await r.json()).error||'';}catch(e){}fail={kind:'http',status:r.status,detail:d};}
      else{const j=await r.json();
        // An empty queue is a normal day, not a failure — load the app and show an empty state.
        // Only a missing or erroring API blocks entry.
        if(j&&Array.isArray(j.queue)){data=j;S.src='live';}
        else fail={kind:'empty'};
        break;
      }
    }catch(e){
      const ab=e&&(e.name==='AbortError'||/abort/i.test(String(e.message||'')));
      fail=ab?{kind:'slow'}:{kind:'net',detail:String(e&&e.message||e)};
    }
  }
  if(!data){return errorView(fail);}
  S.role=data.role||'tl';
  S.auditRaw=String((data.queue&&data.queue[0]&&data.queue[0].audit_date)||'').slice(0,10);
  S.auditDate=fmtLongDate((data.queue&&data.queue[0]&&data.queue[0].audit_date)||'');
  S.user=data.user||sess||null;
  S.meEmail=data.meEmail||null;
  S.unmapped=data.unmappedLrms||[];
  S.mapping=data.mappingOverrides||null;
  buildModel(data.queue||[],data.hierarchy||[]);
  if(S.role==='zsm'||S.role==='ados'||S.role==='admin')S.screen='mgr';
  render();
  loadRcaLog();
  loadAccess();
  if(S.role==='admin')loadMapping();
  flushRca();
  if(!(data.queue||[]).length)loadDiag();
}

function buildModel(queue,hier){
  const H={};hier.forEach(h=>H[norm(h.lrm_email)]=h);
  const base={mcch_past:45,followup_missed:40,not_interested:52,not_qualified:52,mcch_future:34};
  const leadsByTl={},tlMeta={};
  queue.forEach(row=>{
    const h=H[norm(row.lrm_email)]||{};const tl=h.tl_email||'unassigned';
    const urg=Math.max(20,Math.min(100,base[row.category]+(row.days_overdue||0)*8));
    const cname=row.customer_name||('Lead '+row.lead_id);
    const lead={id:row.lead_id,cat:row.category,name:cname,loc:row.cluster,
      meta:(row.cluster||'')+' · '+row.lead_id,LRM:row.lrm_name,ini:ini2(row.customer_name||row.lrm_name||'NA'),lrmIni:ini2(row.lrm_name),
      urg:urg,days:row.days_overdue||0,tlEmail:tl,tlName:h.tl_name||'Unassigned',
      key:Number(row.priority_key)||0,rank:row.category_rank||99,slot:'primary',
      lrmEmail:row.lrm_email||'',
      timeline:buildTL(row),systemNote:buildNote(row),
      lastAt:row.last_activity_at||null,lastType:row.last_activity_type||'',
      silent:Number(row.days_silent)||0,hoursSilent:Number(row.hours_silent)||0,
      calls30:Number(row.calls_30d)||0,connects30:Number(row.connects_30d)||0,leak:row.leak_code||'',
      loops:Number(row.loop_turns)||0,
      sit:row.category==='not_interested'?(row.meeting_confirmed_at?'met':'early'):row.category==='not_qualified'?(row.qualified_at?'disc':'nodisc'):row.category==='followup_missed'?((row.days_overdue||0)>0?'overdue':'today'):''};
    (leadsByTl[tl]=leadsByTl[tl]||[]).push(lead);
    tlMeta[tl]=tlMeta[tl]||{name:h.tl_name||'Unassigned',ini:ini2(h.tl_name||'NA'),cluster:h.cluster||row.cluster};
  });
  // Daily pick, per TL: 4 per category pooled across ALL of that TL's LRMs, then top up to
  // 20 from the leftovers (most overdue first) if any category came up short.
  Object.keys(leadsByTl).forEach(tl=>{
    const byCat={};leadsByTl[tl].forEach(l=>(byCat[l.cat]=byCat[l.cat]||[]).push(l));
    const rank=(a,b)=>(b.key-a.key)||(b.urg-a.urg)||(b.days-a.days);
    let keep=[],rest=[];
    CATS.forEach(c=>{const pool=(byCat[c.key]||[]).slice().sort(rank);keep=keep.concat(pool.slice(0,4));rest=rest.concat(pool.slice(4));});
    if(keep.length<20)rest.sort((a,b)=>(b.days-a.days)||rank(a,b)).slice(0,20-keep.length).forEach(l=>keep.push({...l,slot:'backfill'}));
    leadsByTl[tl]=keep;
  });
  const lrmsByTl={},lrmRiskByTl={};
  Object.keys(leadsByTl).forEach(tl=>{
    const ls=leadsByTl[tl],byLrm={};
    ls.forEach(l=>{(byLrm[l.LRM]=byLrm[l.LRM]||{name:l.LRM,ini:l.lrmIni,cats:{}}).cats[l.cat]=(byLrm[l.LRM].cats[l.cat]||0)+1;});
    const LRMs=Object.values(byLrm).map(r=>{const trend=CATS.map(c=>r.cats[c.key]||0);return{name:r.name,ini:r.ini,trend,flagged:trend.reduce((a,b)=>a+b,0)};});
    const mx=Math.max(1,...LRMs.map(r=>r.flagged));const rr={};LRMs.forEach(r=>rr[r.name]=Math.min(100,Math.round(r.flagged/mx*100)));
    lrmsByTl[tl]=LRMs;lrmRiskByTl[tl]=rr;
  });
  const busiest=Object.keys(leadsByTl).sort((a,b)=>leadsByTl[b].length-leadsByTl[a].length)[0];
  const meTl=(S.meEmail&&leadsByTl[S.meEmail])?S.meEmail:null;
  const curTl=meTl||busiest||null;
  const tls=Object.keys(leadsByTl).map((tl,i)=>{const ls=leadsByTl[tl],m=tlMeta[tl],od=ls.filter(l=>l.days>2).length;
    return{email:tl,name:m.name,ini:m.ini,cluster:m.cluster,total:ls.length,me:tl===meTl,
      topGap:topCat(ls)};});
  S.model={leadsByTl,lrmsByTl,lrmRiskByTl,tls,curTl};S.tlEmail=curTl;S.hier=hier||[];
  const mine=(curTl&&leadsByTl[curTl])||[];
  const first=(mine.filter(l=>l.cat==='mcch_past').sort((a,b)=>(b.key-a.key)||(b.silent-a.silent))[0]||mine[0]||{});
  S.selId=first.id||null;
}
function topCat(ls){const c={};ls.forEach(l=>c[l.cat]=(c[l.cat]||0)+1);const t=Object.keys(c).sort((a,b)=>c[b]-c[a])[0];return t?catObj(t).name:'—';}
function buildTL(row){const t=[],p=(iso,w,k)=>t.push({when:fmtD(iso),what:w,kind:k});
  p(row.created_at,'Lead created','done');
  if(row.category==='mcch_past'){if(row.meeting_confirmed_at)p(row.meeting_confirmed_at,'MCCH set','done');p(row.meeting_schedule_date,'Meeting due','flag');t.push({when:'today',what:'Still MCCH',kind:'pending'});}
  else if(row.category==='mcch_future'){if(row.meeting_confirmed_at)p(row.meeting_confirmed_at,'MCCH set','done');p(row.meeting_schedule_date,'Meeting due','flag');}
  else if(row.category==='followup_missed'){p(row.follow_up_at,'Follow-up due','flag');t.push({when:'today',what:'No attempt',kind:'pending'});}
  else if(row.category==='not_interested'){if(row.meeting_confirmed_at)p(row.meeting_confirmed_at,'MCCH set','done');p(row.status_changed_at,'Marked NI','flag');}
  else if(row.category==='not_qualified'){if(row.qualified_at)p(row.qualified_at,'Discovery','done');p(row.status_changed_at,'Marked NQ','flag');}
  return t;}
function buildNote(row){const d=row.days_overdue||0;const s=Number(row.days_silent)||0;
  const quiet=row.last_activity_at?(s>0?' Nothing logged on the lead for '+s+' day'+(s===1?'':'s')+'.':' Last touched today.'):' No activity ever logged.';
  if(row.category==='mcch_past')return'MCCH date '+fmtD(row.meeting_schedule_date)+' passed '+d+'d ago — still at MCCH, not moved to MD.'+quiet;
  if(row.category==='mcch_future')return'Meeting confirmed for '+fmtD(row.meeting_schedule_date)+' — verify customer confirmation logged and slot within window.'+quiet;
  if(row.category==='followup_missed')return'Follow-up '+(d?('overdue '+d+'d — due '+fmtD(row.follow_up_at)):'due today ('+fmtD(row.follow_up_at)+')')+' — '+(Number(row.calls_30d)||0)+' dial'+((Number(row.calls_30d)||0)===1?'':'s')+' in 30d.'+quiet;
  if(row.category==='not_interested')return'Marked Not Interested on '+fmtD(row.status_changed_at)+(row.meeting_confirmed_at?' — confirm the objection was captured.':' — closed before any meeting.')+quiet;
  if(row.category==='not_qualified')return'Marked Not Qualified on '+fmtD(row.status_changed_at)+(row.qualified_at?' after a discovery call.':' — no discovery call logged.')+quiet;
  return'';}

// ---- call recording: local-first (IndexedDB), uploaded when a blob store is configured ----
let IDB=null;
function idb(){if(IDB)return IDB;IDB=new Promise((res,rej)=>{const q=indexedDB.open('ls_recordings',1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('r'))q.result.createObjectStore('r');};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});return IDB;}
async function idbPut(k,v){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('r','readwrite');t.objectStore('r').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
async function idbAll(){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('r','readonly'),s=t.objectStore('r'),out={},c=s.openCursor();c.onsuccess=e=>{const cur=e.target.result;if(!cur)return res(out);out[cur.key]=cur.value;cur.continue();};c.onerror=()=>rej(c.error);});}
async function idbDel(k){const db=await idb();return new Promise(res=>{const t=db.transaction('r','readwrite');t.objectStore('r').delete(k);t.oncomplete=res;});}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('r','readonly'),q=t.objectStore('r').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error);});}
async function hydrateRecs(){try{const all=await idbAll();Object.keys(all).forEach(k=>{const r=all[k];S.recs[k]={name:r.name,size:r.size,url:r.url||URL.createObjectURL(r.blob),remote:!!r.url,at:r.at};});if(Object.keys(all).length)render();}catch(e){}}
const kb=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';

async function recPick(input,leadId){
  const f=input.files&&input.files[0];input.value='';if(!f)return;
  S.recBusy=leadId;render();
  const url=URL.createObjectURL(f);
  const rec={name:f.name,size:f.size,url,remote:false,at:new Date().toISOString()};
  S.recs[leadId]=rec;
  try{await idbPut(leadId,{name:f.name,size:f.size,blob:f,at:rec.at});}catch(e){}
  try{
    const r=await fetch('/api/recording?lead='+encodeURIComponent(leadId)+'&name='+encodeURIComponent(f.name),
      {method:'POST',headers:Object.assign({'Content-Type':f.type||'application/octet-stream'},authHeaders()),body:f});

}

}

function buildDir(){
  const H=S.hier||[];const tl=new Map(),zsm=new Map(),ados=new Map();
  H.forEach(h=>{if(h.tl_email)tl.set(h.tl_email,h.tl_name||nameFromEmail(h.tl_email));
    if(h.zsm_email)zsm.set(h.zsm_email,h.zsm_name||nameFromEmail(h.zsm_email));
    if(h.ados_email)ados.set(h.ados_email,h.ados_name||nameFromEmail(h.ados_email));});
  const rows=[];
  ados.forEach((n,e)=>rows.push({name:n,email:e,role:'ADOS',team:H.filter(h=>h.ados_email===e).length}));
  zsm.forEach((n,e)=>rows.push({name:n,email:e,role:'ZSM',team:H.filter(h=>h.zsm_email===e).length}));
  tl.forEach((n,e)=>rows.push({name:n,email:e,role:'TL',team:H.filter(h=>h.tl_email===e).length}));
  H.forEach(h=>rows.push({name:h.lrm_name||nameFromEmail(h.lrm_email),email:h.lrm_email,role:'LRM',team:0}));
  return{rows,ados:ados.size,zsm:zsm.size,tl:tl.size,lrm:H.length};

      <td style="${td};width:34px"><input type="checkbox" data-act="unmapSel" data-v="${esc(e)}" ${sel[e]?'checked':''} style="width:15px;height:15px;accent-color:var(--color-accent);cursor:pointer"></td>
      <td style="${td}"><div style="font-weight:600;font-size:14px">${esc(u.lrm_name||nameFromEmail(u.lrm_email)||'\u2014')}</div><div style="${mono}">${esc(u.lrm_email||'no email on the lead record')}</div></td>
      <td style="${td};font-size:13px;color:${MUT(58)}">${esc(u.cluster||'\u2014')}</td>
      <td style="${td};text-align:right;font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;color:var(--color-accent-2-800)">${u.leads}</td>
      <td style="${td}"><select data-act="mapTl" data-v="${esc(e)}" style="font-family:inherit;font-size:13.5px;padding:5px 0;border:none;border-bottom:1px solid ${MUT(24)};background:none;color:var(--color-text);min-width:20ch">${tlOptions('')}</select></td>
    </tr>`;}).join('');
  return `<div style="animation:lsfade .2s ease">
    <div style="display:flex;align-items:flex-end;gap:48px;flex-wrap:wrap;padding-bottom:26px">
      <div style="flex:1;min-width:280px">
        <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap">
          <div style="font-family:var(--font-heading);font-size:44px;line-height:1;font-weight:700;color:var(--color-accent-2)">${list.length}</div>
          <div style="font-size:16px;color:${MUT(62)};padding-bottom:3px">LRMs with no team lead \u2014 <b>${leads}</b> leads nobody can review</div>
        </div>
        <div style="font-size:13.5px;line-height:1.6;color:${MUT(55)};padding-top:14px;max-width:76ch;text-wrap:pretty">These leads are dropped before the queue reaches an auditor, because there is no one to route them to. Give each LRM a team lead here and their leads appear in that lead\u2019s queue on the next pull \u2014 no EmployeeMaster edit needed.</div>
      </div>
    </div>
    ${S.mapErr?`<div style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--color-accent-2-800);padding-bottom:16px">${ic('ph-warning-circle',15,'var(--color-accent-2)')}Could not save: ${esc(S.mapErr)}</div>`:''}
    ${S.mapMsg?`<div style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--color-accent-800);padding-bottom:16px">${ic('ph-check-circle',15,'var(--color-accent)')}${esc(S.mapMsg)}</div>`:''}
    <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:0 0 16px">
      <button class="ls-btn" data-act="unmapAll" style="background:none;border:none;padding:0;font-size:13px;color:${MUT(52)};text-decoration:underline">${nsel===list.length?'Clear selection':'Select all '+list.length}</button>
      <span style="flex:1"></span>
      <span style="font-size:13px;color:${nsel?'var(--color-text)':MUT(42)}">${nsel} selected</span>
      <select data-act="bulkTl" style="font-family:inherit;font-size:13.5px;padding:6px 0;border:none;border-bottom:1px solid ${MUT(24)};background:none;color:var(--color-text);min-width:22ch">${tlOptions(S.mapBulkTl||'')}</select>
      <button class="ls-btn ${nsel&&S.mapBulkTl?'ls-btn-solid':''}" data-act="bulkAssign" ${nsel&&S.mapBulkTl?'':'aria-disabled="true"'} style="font-size:13.5px;font-weight:600;padding:9px 18px;${nsel&&S.mapBulkTl?'':'cursor:not-allowed;border:1px solid '+MUT(20)+';background:none;color:'+MUT(36)+';'}">${S.mapBusy?'Saving\u2026':'Assign selected'}</button>
    </div>
    <table style="width:100%;border-collapse:collapse">
      <thead><tr><th style="${th};padding-left:0"></th><th style="${th}">LRM</th><th style="${th}">Cluster</th><th style="${th};text-align:right">Leads held</th><th style="${th}">Assign to</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function settingsView(){
  const tab=S.setTab||'access';
  const btn=([k,l,i])=>`<button class="ls-btn" data-act="setTab" data-v="${k}" style="background:none;border:none;padding:0 0 8px;font-size:14.5px;display:inline-flex;align-items:center;gap:8px;color:${tab===k?'var(--color-text)':MUT(50)};font-weight:${tab===k?'600':'400'};border-bottom:2px solid ${tab===k?'var(--color-text)':'transparent'}">${ic(i,17,tab===k?(k==='unmapped'&&(S.unmapped||[]).length?'var(--color-accent-2)':'var(--color-accent)'):MUT(40))}${l}${k==='unmapped'&&(S.unmapped||[]).length?`<span class="ls-badge" style="background:var(--color-accent-2-100);color:var(--color-accent-2-800)">${(S.unmapped||[]).length}</span>`:''}</button>`;
  return `<div class="wrap" style="padding-bottom:90px;animation:lsfade .25s ease">
    <div style="padding:38px 0 22px">
      ${kicker('Administration',10)}
      <h2 style="margin:0;font-family:var(--font-heading);font-size:44px;line-height:1;font-weight:700;letter-spacing:-.02em">Settings</h2>
    </div>
    <div style="display:flex;gap:34px;flex-wrap:wrap;padding-bottom:34px;border-bottom:1px solid var(--color-divider);margin-bottom:34px">${SET_TABS.map(btn).join('')}</div>
    ${tab==='mapping'?mappingPane():tab==='unmapped'?unmappedPane():accessPane()}
  </div>`;
}
function renderKeepFocus(sel){render();const el=document.querySelector(sel);if(el){el.focus();try{const n=el.value.length;el.setSelectionRange(n,n);}catch(e){}}}
function mgrView(){
  const tls=TLS();
  const myTl=S.meEmail||null;
  const catCount=(tl,k)=>((S.model&&S.model.leadsByTl[tl])||[]).filter(l=>l.cat===k).length;
  const doneFor=tl=>doneByTl(tl);
  const totAll=tls.reduce((s,t)=>s+t.total,0);
  const rows=tls.map(t=>{
    const tot=t.total,dn=doneFor(t.email),open=tot-dn,mine=t.email===myTl,pc=tot?dn/tot*100:0;
    const td=`padding:12px 10px;border-bottom:1px solid var(--color-divider);font-variant-numeric:tabular-nums;text-align:right`;
    const tone=pc>=100?'var(--color-accent)':pc>=50?'var(--color-text)':'var(--color-accent-2)';
    return `<tr class="ls-row">
      <td style="${td};text-align:left;padding-left:0"><span style="font-weight:600">${esc(t.name)}</span>${mine?`<span style="font-weight:400;color:${MUT(45)}"> · you</span>`:''}</td>
      <td style="${td};text-align:left;color:${MUT(58)}">${esc(t.cluster||'—')}</td>
      <td style="${td};width:140px"><span style="display:flex;align-items:center;gap:9px">${bar(pc,tone)}<span style="font-size:12px;color:${MUT(50)};min-width:4ch;text-align:right">${Math.round(pc)}%</span></span></td>
      <td style="${td}">${tot}</td>
      <td style="${td}">${dn}</td>
      <td style="${td};${open?'':'color:'+MUT(32)}">${open||'—'}</td>
      ${CATS.map(c=>`<td style="${td};color:${MUT(62)}">${catCount(t.email,c.key)||''}</td>`).join('')}
    </tr>`;}).join('');
  const catTot=CATS.map(c=>tls.reduce((s,t)=>s+catCount(t.email,c.key),0));
  const doneAll=tls.reduce((s,t)=>s+doneFor(t.email),0);
  const th=`padding:0 10px 9px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:400;color:${MUT(45)};border-bottom:2px solid var(--color-text)`;
  const head=`<tr><th style="${th};text-align:left;padding-left:0">Team lead</th><th style="${th};text-align:left">Cluster</th><th style="${th};text-align:right">Progress</th><th style="${th};text-align:right">To audit</th><th style="${th};text-align:right">Done</th><th style="${th};text-align:right">Open</th>${CATS.map(c=>`<th style="${th};text-align:right"><span style="display:inline-flex;align-items:center;gap:5px;justify-content:flex-end">${ic(cstyle(c.key).icon,13,cstyle(c.key).tone)}${esc(c.short||c.name)}</span></th>`).join('')}</tr>`;
  const tdf=`padding:11px 10px;border-bottom:1px solid var(--color-divider);font-variant-numeric:tabular-nums;text-align:right`;
  const foot=`<tr><td style="${tdf};text-align:left;padding-left:0;font-weight:700;border-bottom:none;border-top:1px solid var(--color-text)">All teams</td><td style="${tdf};border-bottom:none;border-top:1px solid var(--color-text)"></td><td style="${tdf};border-bottom:none;border-top:1px solid var(--color-text)"></td><td style="${tdf};font-weight:700;border-bottom:none;border-top:1px solid var(--color-text)">${totAll}</td><td style="${tdf};font-weight:700;border-bottom:none;border-top:1px solid var(--color-text)">${doneAll}</td><td style="${tdf};font-weight:700;border-bottom:none;border-top:1px solid var(--color-text)">${totAll-doneAll}</td>${catTot.map(n=>`<td style="${tdf};font-weight:700;border-bottom:none;border-top:1px solid var(--color-text)">${n||''}</td>`).join('')}</tr>`;
  if(!tls.length)return `<div class="wrap" style="padding-top:96px"><h2 style="margin:0 0 12px;font-size:34px;font-weight:700">No teams in today’s queue</h2><div style="font-size:15.5px;line-height:1.6;color:${MUT(60)};max-width:56ch;text-wrap:pretty">Nothing has been distributed across teams yet — either today’s export is empty, or its leads aren’t matching the mapping sheet.</div>${diagBlock()}</div>`;
  return `<div class="wrap" style="padding-bottom:80px;animation:lsfade .25s ease">
    <div style="padding:38px 0 28px">
      ${kicker(esc(S.auditDate||'Today'),10)}
      <div style="display:flex;align-items:flex-end;gap:48px;flex-wrap:wrap">
        <div style="flex:1;min-width:300px">
          <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap">
            <h2 style="margin:0;font-family:var(--font-heading);font-size:54px;line-height:.98;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums">${doneAll}<span style="color:${MUT(28)}"> / ${totAll}</span></h2>
            <span style="font-size:17px;color:${MUT(62)};padding-bottom:5px">RCAs logged across ${tls.length} team${tls.length===1?'':'s'}</span>
          </div>
        </div>
        <div style="display:flex;gap:44px;flex-wrap:wrap;padding-bottom:4px">
          <div><div style="font-family:var(--font-heading);font-size:30px;line-height:1;font-weight:700;color:${totAll-doneAll?'var(--color-accent-2)':MUT(32)}">${totAll-doneAll}</div><div style="font-size:12px;color:${MUT(52)};padding-top:6px">Still open</div></div>
          <div><div style="font-family:var(--font-heading);font-size:30px;line-height:1;font-weight:700">${tls.filter(t=>doneFor(t.email)>=t.total&&t.total).length}</div><div style="font-size:12px;color:${MUT(52)};padding-top:6px">Teams clear</div></div>
        </div>
      </div>
      <div style="padding-top:22px;display:flex;align-items:center;gap:16px">
        <span style="flex:1">${bar(totAll?doneAll/totAll*100:0,doneAll===totAll&&totAll?'var(--color-accent)':'var(--color-text)')}</span>
        <span style="font-size:12.5px;font-variant-numeric:tabular-nums;color:${MUT(50)}">${totAll?Math.round(doneAll/totAll*100):0}%</span>
      </div>
    </div>
    <table style="width:100%;border-collapse:collapse;font-size:14px"><thead>${head}</thead><tbody>${rows}${foot}</tbody></table>
    <div style="font-size:12.5px;line-height:1.6;color:${MUT(48)};max-width:76ch;padding-top:20px">Live from today’s queue and the shared RCA log. “Done” counts the latest logged RCA per lead${S.rcaPending?` · <b>${S.rcaPending} of yours still syncing</b>`:''}${S.rcaErr?` · <span style="color:var(--color-accent-2-700)">log write failing: ${esc(S.rcaErr)}</span>`:''}</div>
  </div>`;
}

// ---- events ----
function patch(id,o){S.audits[id]=Object.assign({reason:'',sev:'',note:'',action:'No action needed',submitted:false,at:''},S.audits[id],o);}
// Submitting is a deliberate act, not a side effect of typing: the RCA stays a draft until
// the TL presses Submit. That press is what gets logged and what "done" counts.
function submitRca(id){
  const a=S.audits[id]||{};
  if(!a.reason||!a.sev||!a.action)return;
  const d=new Date(),hh=d.getHours()%12||12,ap=d.getHours()<12?'AM':'PM';
  patch(id,{submitted:true,at:hh+':'+String(d.getMinutes()).padStart(2,'0')+' '+ap});
  queueRca(id);
  const dl=catLeads(S.catKey),i=dl.findIndex(x=>x.id===id);
  for(let k=1;k<=dl.length;k++){const j=(i+k)%dl.length;if(!rcaDone(dl[j].id)){S.selId=dl[j].id;break;}}
  render();
}
function patchRv(id,o){S.rcaReview[id]=Object.assign({verdict:null,note:'',assignee:'',notified:false},S.rcaReview[id],o);}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const act=t.dataset.act,v=t.dataset.v;
  if(act==='nav'){S.screen=v;render();}
  else if(act==='diag'){loadDiag();}
  else if(act==='sampleRole'){if(SAMPLE&&v!==S.role)applySample(v);}
  else if(act==='signout'){signOut();}
  else if(act==='rules'){S.showRules=!S.showRules;render();}
  else if(act==='cat'){S.catKey=v;S.selId=(catLeads(v)[0]||{}).id;render();}
  else if(act==='lead'){S.selId=v;render();}
  else if(act==='sev'){patch(S.selId,{sev:v});render();}
  else if(act==='why'){const l=L().find(x=>x.id===S.selId);if(!l)return;const idx=((S.audits[S.selId]&&S.audits[S.selId].whyIdx)||[]).slice();idx.push(+v);patch(S.selId,{whyIdx:idx});const w=whyWalk(l);if(w.terminal){patch(S.selId,{reason:w.terminal});if(!(S.audits[S.selId]&&S.audits[S.selId].sev))patch(S.selId,{sev:'med'});}else patch(S.selId,{reason:''});render();}
  else if(act==='whyBack'){const idx=((S.audits[S.selId]&&S.audits[S.selId].whyIdx)||[]).slice(0,+v);patch(S.selId,{whyIdx:idx,reason:''});render();}
  else if(act==='submitRca'){submitRca(S.selId);}
  else if(act==='reopen'){patch(S.selId,{submitted:false});render();}
  else if(act==='prev'){const dl=catLeads(S.catKey),i=dl.findIndex(x=>x.id===S.selId);S.selId=dl[(i-1+dl.length)%dl.length].id;render();}
  else if(act==='next'){const dl=catLeads(S.catKey),i=dl.findIndex(x=>x.id===S.selId);for(let k=1;k<=dl.length;k++){const j=(i+k)%dl.length;if(!rcaDone(dl[j].id)){S.selId=dl[j].id;render();return;}}S.selId=dl[(i+1)%dl.length].id;render();}
  else if(act==='rcaAccept'){const cur=S.rcaReview[v]||{};patchRv(v,{verdict:cur.verdict==='accept'?null:'accept'});render();}
  else if(act==='rcaRework'){const cur=S.rcaReview[v]||{};patchRv(v,{verdict:cur.verdict==='rework'?null:'rework'});render();}
  else if(act==='rcaNotify'){patchRv(v,{notified:true});render();}
  else if(act==='accessFilter'){S.accessFilter=v;render();}
  else if(act==='setTab'){S.setTab=v;S.mapErr='';S.mapMsg='';render();}
  else if(act==='mapFilter'){S.mapFilter=v;render();}
  else if(act==='mapClear'){saveMapping([{lrm_email:v,clear:true}]);}
  else if(act==='unmapAll'){const l=S.unmapped||[],sel=S.mapSel||{},n=Object.keys(sel).filter(k=>sel[k]).length;
    S.mapSel={};if(n!==l.length)l.forEach(u=>{const e=norm(u.lrm_email);if(e)S.mapSel[e]=true;});render();}
  else if(act==='bulkAssign'){
    const sel=S.mapSel||{},tl=S.mapBulkTl||'';
    const ids=Object.keys(sel).filter(k=>sel[k]&&k.indexOf('@')>=0);
    if(!tl||!ids.length)return;
    const chain=chainFor(tl),src=(S.unmapped||[]);
    saveMapping(ids.map(e=>{const u=src.find(x=>norm(x.lrm_email)===e)||{};
      return Object.assign({lrm_email:e,lrm_name:u.lrm_name||'',cluster:u.cluster||''},chain);}));
  }
  else if(act==='accessAdd'){const e=(S.newAccessEmail||'').trim();if(e){saveAccess(e,S.newAccessRole||'auditor');S.newAccessEmail='';}}
});
document.addEventListener('change',e=>{const t=e.target.closest('[data-act]');if(!t)return;
  if(t.dataset.act==='reason'){patch(S.selId,{reason:t.value});if(t.value&&!(S.audits[S.selId]&&S.audits[S.selId].sev))patch(S.selId,{sev:'med'});render();}
  else if(t.dataset.act==='action'){patch(S.selId,{action:t.value});render();}
  else if(t.dataset.act==='rcaAssignee'){patchRv(t.dataset.v,{assignee:t.value,notified:false});render();}
  else if(t.dataset.act==='mapTl'){
    const e=t.dataset.v;
    if(e.indexOf('@')<0){S.mapErr='That lead record carries no LRM email, so it cannot be mapped. Fix the email in the CRM first.';render();return;}
    const u=(S.unmapped||[]).find(x=>norm(x.lrm_email)===e)||{};
    saveMapping([Object.assign({lrm_email:e,lrm_name:u.lrm_name||'',cluster:u.cluster||''},chainFor(t.value))]);
  }
  else if(t.dataset.act==='bulkTl'){S.mapBulkTl=t.value;render();}
  else if(t.dataset.act==='unmapSel'){S.mapSel=Object.assign({},S.mapSel,{[t.dataset.v]:t.checked});render();}
});
document.addEventListener('input',e=>{const t=e.target.closest('[data-act]');if(!t)return;
  if(t.dataset.act==='note'){S.audits[S.selId]=Object.assign({},S.audits[S.selId],{note:t.value});}
  else if(t.dataset.act==='rcaNote'){S.rcaReview[t.dataset.v]=Object.assign({verdict:null,assignee:'',notified:false},S.rcaReview[t.dataset.v],{note:t.value});}
  else if(t.dataset.act==='auditorInput'){S.newAuditor=t.value;}
  else if(t.dataset.act==='dirSearch'){S.dirQ=t.value;renderKeepFocus('[data-act="dirSearch"]');}
  else if(t.dataset.act==='mapSearch'){S.mapQ=t.value;renderKeepFocus('[data-act="mapSearch"]');}
  else if(t.dataset.act==='accessRole'){saveAccess(t.dataset.v,t.value);}
  else if(t.dataset.act==='accessNewRole'){S.newAccessRole=t.value;}
  else if(t.dataset.act==='accessNewEmail'){S.newAccessEmail=t.value;}
});
document.addEventListener('keydown',e=>{const t=e.target.closest&&e.target.closest('[data-act="accessNewEmail"]');if(t&&e.key==='Enter'){e.preventDefault();const em=(t.value||'').trim();if(em)saveAccess(em,S.newAccessRole||'auditor');S.newAccessEmail='';}});

setInterval(tickTimers,1000);
setInterval(flushRca,20000);
load();
hydrateRecs();
</script>
</body>
