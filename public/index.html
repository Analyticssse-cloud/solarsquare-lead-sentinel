const WHYS={

function logoImg(h){return '<img src="'+LOGO_SRC+'" alt="SolarSquare" style="height:'+h+'px;width:auto;display:block" onerror="logoFallback(this,'+h+')">';}
function logoFallback(el,h){const fs=Math.round(h*0.66);el.outerHTML='<span style="font-family:var(--font-heading);font-size:'+fs+'px;font-weight:600;letter-spacing:-.01em;color:var(--color-text)">Solar<span style="color:var(--color-accent)">Square</span></span>';}

function readSession(){try{return JSON.parse(localStorage.getItem('ls_auth')||'null');}catch(e){return null;}}
function saveSession(o){try{localStorage.setItem('ls_auth',JSON.stringify(o));}catch(e){}}
function signOut(){try{if(window.google&&google.accounts&&google.accounts.id)google.accounts.id.disableAutoSelect();}catch(e){}localStorage.removeItem('ls_auth');location.reload();}
function decodeJwt(t){try{const b=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(b))));}catch(e){return{};}}
function authHeaders(){const a=readSession();return a&&a.token?{Authorization:'Bearer '+a.token}:{};}
let gisReady=null;
function loadGis(){if(gisReady)return gisReady;gisReady=new Promise(res=>{if(window.google&&google.accounts)return res(true);const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=1;s.defer=1;s.onload=()=>res(true);s.onerror=()=>res(false);document.head.appendChild(s);});return gisReady;}
function authMsg(html){const el=document.getElementById('autherr');if(el)el.innerHTML=html||'';}
function handleCredential(resp){const c=decodeJwt(resp.credential);const em=(c.email||'').toLowerCase();if(AUTH.domain&&c.hd!==AUTH.domain&&!em.endsWith('@'+AUTH.domain)){authMsg('Signed in as <b>'+esc(em||'?')+'</b> — that isn\u2019t an @'+esc(AUTH.domain)+' account. Sign in with your SolarSquare login.');return;}saveSession({name:c.name||'',email:c.email||'',picture:c.picture||'',token:resp.credential});location.reload();}
async function renderGoogleBtn(el){
  const ok=await loadGis();
  if(!ok){authMsg('Could not reach Google Sign-In (network/adblock). Check your connection and reload.');return;}
  if(!el||!window.google)return;
  if(!AUTH.clientId){authMsg('Sign-in isn\u2019t configured yet — <code>GOOGLE_CLIENT_ID</code> is not set on the server.');return;}
  try{
    google.accounts.id.initialize({client_id:AUTH.clientId,callback:handleCredential,hd:AUTH.domain,
      error_callback:e=>{authMsg('Google rejected sign-in: <b>'+esc((e&&(e.type||e.message))||'unknown')+'</b>. If this says <i>origin</i>, this site\u2019s URL must be added to the OAuth client\u2019s <b>Authorized JavaScript origins</b> in Google Cloud Console.');}});
    el.innerHTML='';
    google.accounts.id.renderButton(el,{theme:'outline',size:'large',shape:'rectangular',text:'signin_with',logo_alignment:'center',width:360});
    google.accounts.id.prompt(n=>{if(n&&n.isSkippedMoment&&n.isSkippedMoment()){/* one-tap skipped; button still works */}});
  }catch(err){authMsg('Sign-in init failed: <b>'+esc(String(err&&err.message||err))+'</b>');}
}
async function initAuth(){
  try{const r=await fetch('/api/config',{cache:'no-store'});if(r.ok){const c=await r.json();AUTH.enabled=!!c.enabled;AUTH.clientId=c.clientId||'';AUTH.domain=(c.allowedDomain||AUTH.domain||'').toLowerCase();AUTH.admins=c.admins||[];}else{AUTH.enabled=false;}}
  catch(e){AUTH.enabled=false;}
  AUTH.ready=true;
}
function loginView(denied,reason){

  const rmsg=reason?(rmap[reason]||('Server said: '+esc(reason))):'';
  document.getElementById('app').innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:40px 24px">
    <div style="width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;text-align:center">

      <div style="width:56px;height:1px;background:${MUT(18)};margin-bottom:28px"></div>
      <div style="font-size:15px;line-height:1.6;color:${MUT(62)};max-width:36ch;margin-bottom:32px">${denied?`<b>${em}</b> isn't authorised for Lead Sentinel.<br>Sign in with a mapped TL or manager account, or ask an admin for access.`:'Sign in with your SolarSquare account to open today’s audit queue.'}</div>
      <div id="gbtn" style="min-height:48px;display:grid;place-items:center;width:100%"></div>
      <div id="autherr" style="font-size:12.5px;line-height:1.55;color:var(--color-accent-2-700);max-width:360px;margin-top:16px">${rmsg}</div>
      ${denied?`<button class="btn btn-secondary" onclick="signOut()" style="font-size:12.5px;margin-top:16px">Use a different account</button>`:''}
      <div style="font-size:12px;color:${MUT(42)};margin-top:36px">Restricted to @${esc(AUTH.domain)} accounts</div>
    </div></div>`;
  renderGoogleBtn(document.getElementById('gbtn'));
}

function buildModel(queue,hier){
  const H={};hier.forEach(h=>H[norm(h.lrm_email)]=h);
  const base={mcch_past:45,followup_missed:40,not_interested:52,not_qualified:52,mcch_future:34};
  const leadsByTl={},tlMeta={};
  queue.forEach(row=>{
    const h=H[norm(row.lrm_email)]||{};const tl=h.tl_email||'unassigned';
    const urg=Math.max(20,Math.min(100,base[row.category]+(row.days_overdue||0)*8));
    const cname=row.customer_name||('Lead '+row.lead_id);
    const lead={id:row.lead_id,cat:row.category,name:cname,loc:row.cluster,
      meta:(row.cluster||'')+' · '+row.lead_id,LRM:row.lrm_name,ini:ini2(row.customer_name||row.lrm_name||'NA'),lrmIni:ini2(row.lrm_name),
      urg:urg,days:row.days_overdue||0,tlEmail:tl,tlName:h.tl_name||'Unassigned',
      key:Number(row.priority_key)||0,rank:row.category_rank||99,slot:'primary',
      timeline:buildTL(row),systemNote:buildNote(row),
      lastAt:row.last_activity_at||null,lastType:row.last_activity_type||'',
      silent:Number(row.days_silent)||0,hoursSilent:Number(row.hours_silent)||0,
      calls30:Number(row.calls_30d)||0,connects30:Number(row.connects_30d)||0,leak:row.leak_code||'',
      sit:row.category==='not_interested'?(row.meeting_confirmed_at?'met':'early'):row.category==='not_qualified'?(row.qualified_at?'disc':'nodisc'):row.category==='followup_missed'?((row.days_overdue||0)>0?'overdue':'today'):''};
    (leadsByTl[tl]=leadsByTl[tl]||[]).push(lead);
    tlMeta[tl]=tlMeta[tl]||{name:h.tl_name||'Unassigned',ini:ini2(h.tl_name||'NA'),cluster:h.cluster||row.cluster};
  });
  // Daily pick, per TL: 4 per category pooled across ALL of that TL's LRMs, then top up to
  // 20 from the leftovers (most overdue first) if any category came up short.
  Object.keys(leadsByTl).forEach(tl=>{
    const byCat={};leadsByTl[tl].forEach(l=>(byCat[l.cat]=byCat[l.cat]||[]).push(l));
    const rank=(a,b)=>(b.key-a.key)||(b.urg-a.urg)||(b.days-a.days);
    let keep=[],rest=[];
    CATS.forEach(c=>{const pool=(byCat[c.key]||[]).slice().sort(rank);keep=keep.concat(pool.slice(0,4));rest=rest.concat(pool.slice(4));});
    if(keep.length<20)rest.sort((a,b)=>(b.days-a.days)||rank(a,b)).slice(0,20-keep.length).forEach(l=>keep.push({...l,slot:'backfill'}));
    leadsByTl[tl]=keep;
  });
  const lrmsByTl={},lrmRiskByTl={};
  Object.keys(leadsByTl).forEach(tl=>{
    const ls=leadsByTl[tl],byLrm={};
    ls.forEach(l=>{(byLrm[l.LRM]=byLrm[l.LRM]||{name:l.LRM,ini:l.lrmIni,cats:{}}).cats[l.cat]=(byLrm[l.LRM].cats[l.cat]||0)+1;});
    const LRMs=Object.values(byLrm).map(r=>{const trend=CATS.map(c=>r.cats[c.key]||0);return{name:r.name,ini:r.ini,trend,flagged:trend.reduce((a,b)=>a+b,0)};});
    const mx=Math.max(1,...LRMs.map(r=>r.flagged));const rr={};LRMs.forEach(r=>rr[r.name]=Math.min(100,Math.round(r.flagged/mx*100)));
    lrmsByTl[tl]=LRMs;lrmRiskByTl[tl]=rr;
  });
  const busiest=Object.keys(leadsByTl).sort((a,b)=>leadsByTl[b].length-leadsByTl[a].length)[0];
  const meTl=(S.meEmail&&leadsByTl[S.meEmail])?S.meEmail:null;
  const curTl=meTl||busiest;
  const tls=Object.keys(leadsByTl).map((tl,i)=>{const ls=leadsByTl[tl],m=tlMeta[tl],od=ls.filter(l=>l.days>2).length;
    return{email:tl,name:m.name,ini:m.ini,cluster:m.cluster,total:ls.length,me:tl===meTl,
      simAudited:tl===curTl?null:Math.max(0,ls.length-(i%3)),simDev:tl===curTl?null:od,simHigh:tl===curTl?null:Math.round(od/2),topGap:topCat(ls)};});
  S.model={leadsByTl,lrmsByTl,lrmRiskByTl,tls,curTl};S.tlEmail=curTl;S.hier=hier||[];
  const first=(leadsByTl[curTl].filter(l=>l.cat==='mcch_past').sort((a,b)=>b.urg-a.urg)[0]||leadsByTl[curTl][0]||{});
  S.selId=first.id;
}
function topCat(ls){const c={};ls.forEach(l=>c[l.cat]=(c[l.cat]||0)+1);const t=Object.keys(c).sort((a,b)=>c[b]-c[a])[0];return t?catObj(t).name:'—';}
function buildTL(row){const t=[],p=(iso,w,k)=>t.push({when:fmtD(iso),what:w,kind:k});
  p(row.created_at,'Lead created','done');
  if(row.category==='mcch_past'){if(row.meeting_confirmed_at)p(row.meeting_confirmed_at,'MCCH set','done');p(row.meeting_schedule_date,'Meeting due','flag');t.push({when:'today',what:'Still MCCH',kind:'pending'});}
  else if(row.category==='mcch_future'){if(row.meeting_confirmed_at)p(row.meeting_confirmed_at,'MCCH set','done');p(row.meeting_schedule_date,'Meeting due','flag');}
  else if(row.category==='followup_missed'){p(row.follow_up_at,'Follow-up due','flag');t.push({when:'today',what:'No attempt',kind:'pending'});}
  else if(row.category==='not_interested'){if(row.meeting_confirmed_at)p(row.meeting_confirmed_at,'MCCH set','done');p(row.status_changed_at,'Marked NI','flag');}
  else if(row.category==='not_qualified'){if(row.qualified_at)p(row.qualified_at,'Discovery','done');p(row.status_changed_at,'Marked NQ','flag');}
  return t;}
function buildNote(row){const d=row.days_overdue||0;const s=Number(row.days_silent)||0;
  const quiet=row.last_activity_at?(s>0?' Nothing logged on the lead for '+s+' day'+(s===1?'':'s')+'.':' Last touched today.'):' No activity ever logged.';
  if(row.category==='mcch_past')return'MCCH date '+fmtD(row.meeting_schedule_date)+' passed '+d+'d ago — still at MCCH, not moved to MD.'+quiet;
  if(row.category==='mcch_future')return'Meeting confirmed for '+fmtD(row.meeting_schedule_date)+' — verify customer confirmation logged and slot within window.'+quiet;
  if(row.category==='followup_missed')return'Follow-up '+(d?('overdue '+d+'d — due '+fmtD(row.follow_up_at)):'due today ('+fmtD(row.follow_up_at)+')')+' — '+(Number(row.calls_30d)||0)+' dial'+((Number(row.calls_30d)||0)===1?'':'s')+' in 30d.'+quiet;
  if(row.category==='not_interested')return'Marked Not Interested on '+fmtD(row.status_changed_at)+(row.meeting_confirmed_at?' — confirm the objection was captured.':' — closed before any meeting.')+quiet;
  if(row.category==='not_qualified')return'Marked Not Qualified on '+fmtD(row.status_changed_at)+(row.qualified_at?' after a discovery call.':' — no discovery call logged.')+quiet;
  return'';}

let IDB=null;
function idb(){if(IDB)return IDB;IDB=new Promise((res,rej)=>{const q=indexedDB.open('ls_recordings',1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('r'))q.result.createObjectStore('r');};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});return IDB;}
async function idbPut(k,v){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('r','readwrite');t.objectStore('r').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
async function idbAll(){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('r','readonly'),s=t.objectStore('r'),out={},c=s.openCursor();c.onsuccess=e=>{const cur=e.target.result;if(!cur)return res(out);out[cur.key]=cur.value;cur.continue();};c.onerror=()=>rej(c.error);});}
async function idbDel(k){const db=await idb();return new Promise(res=>{const t=db.transaction('r','readwrite');t.objectStore('r').delete(k);t.oncomplete=res;});}
async function hydrateRecs(){try{const all=await idbAll();Object.keys(all).forEach(k=>{const r=all[k];S.recs[k]={name:r.name,size:r.size,url:r.url||URL.createObjectURL(r.blob),remote:!!r.url,at:r.at};});if(Object.keys(all).length)render();}catch(e){}}
const kb=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';

async function recPick(input,leadId){
  const f=input.files&&input.files[0];input.value='';if(!f)return;
  S.recBusy=leadId;render();
  const url=URL.createObjectURL(f);
  const rec={name:f.name,size:f.size,url,remote:false,at:new Date().toISOString()};
  S.recs[leadId]=rec;
  try{await idbPut(leadId,{name:f.name,size:f.size,blob:f,at:rec.at});}catch(e){}
  try{
    const r=await fetch('/api/recording?lead='+encodeURIComponent(leadId)+'&name='+encodeURIComponent(f.name),
      {method:'POST',headers:Object.assign({'Content-Type':f.type||'application/octet-stream'},authHeaders()),body:f});
    if(r.ok){const j=await r.json();rec.remote=true;rec.url=j.url;try{await idbPut(leadId,{name:f.name,size:f.size,url:j.url,at:rec.at});}catch(e){}}
  }catch(e){}
  S.recBusy=null;render();
}
async function recDrop(leadId){delete S.recs[leadId];await idbDel(leadId);render();}

      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px">
        <div style="display:flex;align-items:center;gap:12px"><span style="width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:999px;background:var(--color-accent-200);color:var(--color-accent-800);font-size:13px;font-weight:700">${esc(ini2(s.LRM))}</span><div style="line-height:1.3"><div style="font-weight:600;font-size:15px">${esc(s.lead)}${s.live?` <span style="font-size:10px;font-weight:700;color:var(--color-accent);margin-left:4px">· yours</span>`:''}</div><div style="font-size:12px;color:${MUT(55)}">${esc(s.LRM)} · TL ${esc(s.tl)} · ${esc(s.when)}</div></div></div>
        <div style="display:flex;gap:8px;align-items:center;flex:none"><span class="${catcls}">${esc(c?c.name:s.cat)}</span><span style="font-size:10px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;${sm[1]}">${sm[0]}</span></div></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;background:var(--color-bg);border:1px solid var(--color-divider);border-radius:14px;padding:14px 16px"><div><div style="font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:${MUT(50)};margin-bottom:4px">Root cause logged</div><div style="font-size:13.5px">${esc(s.rca)}</div></div><div><div style="font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:${MUT(50)};margin-bottom:4px">Corrective action</div><div style="font-size:13.5px">${esc(s.action)}</div></div></div>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--color-divider);padding-top:14px"><span style="font-size:13px;font-weight:600">Is this RCA done correctly?</span><button class="btn" data-act="rcaAccept" data-v="${s.id}" style="${accStyle}"><span style="margin-right:6px">✓</span>Accept RCA</button><button class="btn" data-act="rcaRework" data-v="${s.id}" style="${rewStyle}"><span style="margin-right:6px">↺</span>Needs rework</button><span style="flex:1"></span><span class="${statl[1]}">${statl[0]}</span></div>
      ${noteBlock}</div>`;}).join('');
  return `<div class="wrap" style="max-width:1100px;padding-bottom:44px;animation:lsfade .25s ease">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:14px 0 20px">
      <div><h2 style="margin:0;font-size:30px">RCA audit</h2><div style="font-size:13.5px;color:${MUT(60)}">Review the root-cause analyses TLs logged against breached leads — accept, or send back for rework.</div></div>
      <div style="display:flex;gap:18px"><div style="text-align:right"><div style="font-family:var(--font-heading);font-size:24px">${total}</div><div style="font-size:11px;color:${MUT(55)}">submitted</div></div><div style="text-align:right"><div style="font-family:var(--font-heading);font-size:24px;color:var(--color-accent-2-700)">${acc}</div><div style="font-size:11px;color:${MUT(55)}">accepted</div></div><div style="text-align:right"><div style="font-family:var(--font-heading);font-size:24px;color:var(--color-accent-700)">${rew}</div><div style="font-size:11px;color:${MUT(55)}">rework</div></div><div style="text-align:right"><div style="font-family:var(--font-heading);font-size:24px">${pend}</div><div style="font-size:11px;color:${MUT(55)}">pending</div></div></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px">${cards}</div></div>`;
}
function ensureAuditors(){if(S.rcaAuditors==null){try{const v=JSON.parse(localStorage.getItem('ls_rca_auditor_emails')||'null');S.rcaAuditors=Array.isArray(v)?v:DEFAULT_AUDITORS.slice();}catch(e){S.rcaAuditors=DEFAULT_AUDITORS.slice();}}}
function persistAuditors(){try{localStorage.setItem('ls_rca_auditor_emails',JSON.stringify(S.rcaAuditors));}catch(e){}}
function buildDir(){
  const H=S.hier||[];const tl=new Map(),zsm=new Map(),ados=new Map();
  H.forEach(a=>{if(a.tl_email)tl.set(a.tl_email,{name:a.tl_name||nameFromEmail(a.tl_email),email:a.tl_email});if(a.zsm_email)zsm.set(a.zsm_email,{name:a.zsm_name||nameFromEmail(a.zsm_email),email:a.zsm_email});if(a.ados_email)ados.set(a.ados_email,{name:a.ados_name||nameFromEmail(a.ados_email),email:a.ados_email});});
  const scope=(f,e)=>H.filter(x=>x[f]===e).length;
  const rows=[...[...ados.values()].map(p=>({...p,role:'ADOS',scope:scope('ados_email',p.email)})),...[...zsm.values()].map(p=>({...p,role:'ZSM',scope:scope('zsm_email',p.email)})),...[...tl.values()].map(p=>({...p,role:'TL',scope:scope('tl_email',p.email)})),...H.map(a=>({name:a.lrm_name,email:a.lrm_email,role:'LRM',scope:1}))];
  return{rows,ados:ados.size,zsm:zsm.size,tl:tl.size,lrm:H.length};
}
function settingsView(){
  ensureAuditors();
  const admins=adminEmails(),me=(S.user&&S.user.email||'').toLowerCase();
  const dir=buildDir(),q=(S.dirQ||'').trim().toLowerCase();
  const rows=dir.rows.filter(r=>!q||(r.name&&r.name.toLowerCase().includes(q))||(r.email&&r.email.toLowerCase().includes(q)));
  const em=`font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:${MUT(70)}`;
  const adminRows=admins.map(e=>`<div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><span style="${em}">${esc(e)}</span>${e===me?'<span class="tag tag-accent">You</span>':''}</div>`).join('');
  const audRows=S.rcaAuditors.length?S.rcaAuditors.map(e=>`<div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><span style="${em}">${esc(e)}</span><div style="display:flex;align-items:center;gap:8px">${e===me?'<span class="tag tag-accent">You</span>':''}<button class="btn" data-act="auditorRemove" data-v="${esc(e)}" title="Remove" style="width:26px;height:26px;padding:0;border:1px solid var(--color-divider);font-size:14px;line-height:1;color:${MUT(60)}">×</button></div></div>`).join(''):`<span style="font-size:12.5px;color:${MUT(55)}">No RCA auditors configured.</span>`;
  const stat=(l,v,s)=>`<div class="card elev-sm" style="padding:20px 22px;gap:4px"><div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:${MUT(55)}">${l}</div><div style="font-family:var(--font-heading);font-size:34px;line-height:1">${v}</div><div style="font-size:11.5px;color:${MUT(55)}">${s}</div></div>`;
  const trows=rows.length?rows.map(r=>`<tr><td><span style="display:flex;align-items:center;gap:9px"><span style="width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:999px;background:var(--color-accent-200);color:var(--color-accent-800);font-size:10px;font-weight:700">${esc(ini2(r.name))}</span><span style="font-weight:600;font-size:13px">${esc(r.name||'—')}</span></span></td><td><span style="${em}">${esc(r.email)}</span></td><td style="text-align:center"><span class="${ROLECLS[r.role]}">${r.role}</span></td><td style="text-align:center">${r.scope}</td></tr>`).join(''):`<tr><td colspan="4" style="text-align:center;padding:24px;color:${MUT(55)}">No matches</td></tr>`;
  return `<div class="wrap" style="padding-bottom:44px;animation:lsfade .25s ease">
    <div style="padding:14px 0 20px"><h2 style="margin:0;font-size:30px">Settings</h2><div style="font-size:13.5px;color:${MUT(60)}">Admin-only · access lists and the resolved org chart — who sees what, and why.</div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;padding-bottom:20px">
      <div class="card elev-sm" style="padding:22px 24px;gap:6px"><div style="font-size:14px;font-weight:700">Admin access</div><div style="font-size:12px;color:${MUT(60)};margin-bottom:8px">Unrestricted — sees every team and screen, regardless of org position.</div><div style="display:flex;flex-direction:column;gap:10px">${adminRows}</div><div style="font-size:11.5px;color:${MUT(48)};line-height:1.5;margin-top:12px">Fixed in server config (<code>ADMIN_EMAILS</code>). Changing this list needs a redeploy.</div></div>
      <div class="card elev-sm" style="padding:22px 24px;gap:6px"><div style="font-size:14px;font-weight:700">RCA auditors</div><div style="font-size:12px;color:${MUT(60)};margin-bottom:8px">Can open the RCA audit tab and review any TL's root-cause analysis across teams.</div><div style="display:flex;flex-direction:column;gap:10px">${audRows}</div><div style="display:flex;gap:8px;margin-top:14px"><input class="input" data-act="auditorInput" type="email" value="${esc(S.newAuditor||'')}" placeholder="name@solarsquare.in" style="flex:1"><button class="btn btn-primary" data-act="auditorAdd" style="flex:0 0 auto">Add</button></div><div style="font-size:11.5px;color:${MUT(48)};line-height:1.5;margin-top:12px">Saved to this browser only (not shared with other admins). For a permanent, company-wide change, set the <code>RCA_AUDITOR_EMAILS</code> Vercel env var instead.</div></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding-bottom:20px">${stat('ADOS',dir.ados,'reporting lines')}${stat('ZSMs',dir.zsm,'reporting lines')}${stat('Team Leads',dir.tl,'reporting lines')}${stat('LRMs',dir.lrm,'in EmployeeMaster')}</div>
    <div class="card elev-sm" style="padding:0;overflow:hidden"><div style="padding:16px 20px;border-bottom:1px solid var(--color-divider)"><input class="input" data-act="dirSearch" value="${esc(S.dirQ||'')}" placeholder="Search name or email…" style="max-width:320px"></div><div style="max-height:440px;overflow:auto"><table class="table"><thead><tr><th>Name</th><th>Email</th><th style="text-align:center">Role</th><th style="text-align:center">Team size</th></tr></thead><tbody>${trows}</tbody></table></div></div>
  </div>`;
}
function renderKeepFocus(sel){render();const el=document.querySelector(sel);if(el){el.focus();try{const n=el.value.length;el.setSelectionRange(n,n);}catch(e){}}}
function mgrView(){
  const done=audited(),hi=L().filter(l=>{const x=S.audits[l.id];return x&&x.reason&&x.sev==='high';}).length;
  const rows=TLS().map(t=>{const tot=t.total||20,au=t.me?done:(t.simAudited!=null?t.simAudited:tot),dv=t.me?done:(t.simDev||0),h=t.me?hi:(t.simHigh||0),ad=Math.round(au/tot*100);
    const cls=ad>=90?'tag tag-accent-2':ad>=70?'tag tag-neutral':'tag tag-outline';
    return `<tr style="${t.me?'background:color-mix(in srgb,var(--color-accent) 8%,transparent)':''}"><td><span style="display:flex;align-items:center;gap:10px"><span style="width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:999px;background:${t.me?'var(--color-accent)':'var(--color-accent-200)'};color:${t.me?'var(--color-bg)':'var(--color-accent-800)'};font-size:11px;font-weight:700">${esc(t.ini)}</span><span style="font-weight:600">${esc(t.name)}</span></span></td><td style="color:${MUT(62)}">${esc(t.cluster)}</td><td style="text-align:center">${au}/${tot}</td><td style="text-align:center"><span class="${cls}">${ad}%</span></td><td style="text-align:center">${dv}</td><td style="text-align:center">${h}</td><td style="color:${MUT(75)}">${esc(t.topGap)}</td></tr>`;}).join('');
  const allT=TLS().map(t=>{const tot=t.total||20,au=t.me?done:(t.simAudited!=null?t.simAudited:tot);return{name:t.name,total:tot,au};});
  const tAu=allT.reduce((s,t)=>s+t.au,0),tTot=allT.reduce((s,t)=>s+t.total,0)||1;
  const risk=allT.map(t=>{const open=t.total-t.au,dot=open>6?'#e0821a':open>0?'var(--color-accent)':'var(--color-accent-2)';return `<div style="display:flex;align-items:center;gap:12px"><span style="width:8px;height:8px;border-radius:999px;background:${dot};flex:none"></span><span style="flex:1;font-size:13.5px">${esc(t.name)} — ${open>0?(open+' of '+t.total+' RCAs open'):('all '+t.total+' RCA done')}</span><span class="${open>6?'tag tag-outline':open>0?'tag tag-accent':'tag tag-accent-2'}">${open>6?'At risk':open>0?'On track':'Done'}</span></div>`;}).join('');
  const tcb={mcch_past:44,followup_missed:58,not_interested:39,not_qualified:33,mcch_future:27};
  const tgaps=CATS.map(c=>{const r=tcb[c.key];return `<div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;gap:10px"><span style="display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600"><span style="width:10px;height:10px;border-radius:999px;background:${c.dot}"></span>${esc(c.name)}</span><span style="font-size:12.5px;color:${MUT(60)}">${r}% breach</span></div><span style="height:8px;border-radius:999px;background:${MUT(9)};overflow:hidden"><span style="display:block;height:100%;width:${r}%;background:${r>=50?'#b2622d':r>=25?'var(--color-accent)':'var(--color-accent-2)'};border-radius:999px"></span></span></div>`;}).join('');
  return `<div class="wrap" style="padding-bottom:44px;animation:lsfade .25s ease">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:14px 0 20px"><div><h2 style="margin:0;font-size:30px">Team-lead oversight</h2><div style="font-size:13.5px;color:${MUT(60)}">Friday, 25 Jul 2026 · RCA adherence and breaches across all TLs</div></div><div style="display:flex;gap:14px"><div style="text-align:right"><div style="font-family:var(--font-heading);font-size:24px">${Math.round(tAu/tTot*100)}%</div><div style="font-size:11px;color:${MUT(55)}">team adherence</div></div><div style="text-align:right"><div style="font-family:var(--font-heading);font-size:24px">${tTot-tAu}</div><div style="font-size:11px;color:${MUT(55)}">RCAs missed</div></div></div></div>
    <div class="card elev-sm" style="padding:6px 22px 14px;margin-bottom:18px"><table class="table"><thead><tr><th>Team lead</th><th>Cluster</th><th style="text-align:center">RCA done</th><th style="text-align:center">Adherence</th><th style="text-align:center">RCAs logged</th><th style="text-align:center">High sev</th><th>Top breach category</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px"><div class="card elev-sm" style="padding:22px 24px;gap:16px"><div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:${MUT(55)}">Breach rate by category · team-wide</div>${tgaps}</div><div class="card elev-sm" style="padding:22px 24px;gap:14px"><div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:${MUT(55)}">RCA adherence risk · cutoff 7:00 PM</div>${risk}</div></div></div>`;
}

// ---- events ----
function patch(id,o){S.audits[id]=Object.assign({reason:'',sev:'',note:'',action:'No action needed'},S.audits[id],o);}
function patchRv(id,o){S.rcaReview[id]=Object.assign({verdict:null,note:'',assignee:'',notified:false},S.rcaReview[id],o);}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const act=t.dataset.act,v=t.dataset.v;
  if(act==='nav'){S.screen=v;render();}
  else if(act==='signout'){signOut();}
  else if(act==='rules'){S.showRules=!S.showRules;render();}
  else if(act==='cat'){S.catKey=v;S.selId=(catLeads(v)[0]||{}).id;render();}
  else if(act==='lead'){S.selId=v;render();}
  else if(act==='sev'){patch(S.selId,{sev:v});render();}
  else if(act==='why'){const l=L().find(x=>x.id===S.selId);if(!l)return;const idx=((S.audits[S.selId]&&S.audits[S.selId].whyIdx)||[]).slice();idx.push(+v);patch(S.selId,{whyIdx:idx});const w=whyWalk(l);if(w.terminal){patch(S.selId,{reason:w.terminal});if(!(S.audits[S.selId]&&S.audits[S.selId].sev))patch(S.selId,{sev:'med'});}else patch(S.selId,{reason:''});render();}
  else if(act==='whyBack'){const idx=((S.audits[S.selId]&&S.audits[S.selId].whyIdx)||[]).slice(0,+v);patch(S.selId,{whyIdx:idx,reason:''});render();}
  else if(act==='prev'){const dl=catLeads(S.catKey),i=dl.findIndex(x=>x.id===S.selId);S.selId=dl[(i-1+dl.length)%dl.length].id;render();}
  else if(act==='next'){const dl=catLeads(S.catKey),i=dl.findIndex(x=>x.id===S.selId);for(let k=1;k<=dl.length;k++){const j=(i+k)%dl.length;if(!rcaDone(dl[j].id)){S.selId=dl[j].id;render();return;}}S.selId=dl[(i+1)%dl.length].id;render();}
  else if(act==='rcaAccept'){const cur=S.rcaReview[v]||{};patchRv(v,{verdict:cur.verdict==='accept'?null:'accept'});render();}
  else if(act==='rcaRework'){const cur=S.rcaReview[v]||{};patchRv(v,{verdict:cur.verdict==='rework'?null:'rework'});render();}
  else if(act==='rcaNotify'){patchRv(v,{notified:true});render();}
  else if(act==='auditorAdd'){ensureAuditors();const e=(S.newAuditor||'').trim().toLowerCase();if(e&&!S.rcaAuditors.includes(e)){S.rcaAuditors=[...S.rcaAuditors,e];persistAuditors();}S.newAuditor='';render();}
  else if(act==='auditorRemove'){ensureAuditors();S.rcaAuditors=S.rcaAuditors.filter(x=>x!==v);persistAuditors();render();}
});
document.addEventListener('change',e=>{const t=e.target.closest('[data-act]');if(!t)return;
  if(t.dataset.act==='reason'){patch(S.selId,{reason:t.value});if(t.value&&!(S.audits[S.selId]&&S.audits[S.selId].sev))patch(S.selId,{sev:'med'});render();}
  else if(t.dataset.act==='action')patch(S.selId,{action:t.value});
  else if(t.dataset.act==='rcaAssignee'){patchRv(t.dataset.v,{assignee:t.value,notified:false});render();}
});
document.addEventListener('input',e=>{const t=e.target.closest('[data-act]');if(!t)return;
  if(t.dataset.act==='note'){S.audits[S.selId]=Object.assign({},S.audits[S.selId],{note:t.value});}
  else if(t.dataset.act==='rcaNote'){S.rcaReview[t.dataset.v]=Object.assign({verdict:null,assignee:'',notified:false},S.rcaReview[t.dataset.v],{note:t.value});}
  else if(t.dataset.act==='auditorInput'){S.newAuditor=t.value;}
  else if(t.dataset.act==='dirSearch'){S.dirQ=t.value;renderKeepFocus('[data-act="dirSearch"]');}
});
document.addEventListener('keydown',e=>{const t=e.target.closest&&e.target.closest('[data-act="auditorInput"]');if(t&&e.key==='Enter'){e.preventDefault();ensureAuditors();const em=(S.newAuditor||'').trim().toLowerCase();if(em&&!S.rcaAuditors.includes(em)){S.rcaAuditors=[...S.rcaAuditors,em];persistAuditors();}S.newAuditor='';render();}});

setInterval(tickTimers,1000);
load();
hydrateRecs();
</script>
</body>
</html>
